<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: "Poppins", sans-serif;
    }
  </style>
</head>
<body class="bg-[#04143B] text-white min-h-screen">

  <header class="fixed top-0 left-0 w-full z-50 bg-[#04143B] flex items-center justify-between px-4 py-3 max-w-[1280px] mx-auto shadow-md">
    <!-- Header vacío por ahora -->
  </header>

  <main class="max-w-[1280px] mx-auto px-4 mt-24">
    <h1 class="text-3xl font-bold mb-6">Todas las Películas</h1>

    <!-- Contenedor de películas -->
    <section id="movies-container" 
             class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
    </section>

    <!-- Estado (Loader / Error) -->
    <div id="status" class="flex justify-center items-center py-10">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 border-4 border-white/20 border-t-[#4A7FFF] rounded-full animate-spin"></div>
        <span id="status-text">Cargando películas...</span>
      </div>
    </div>
  </main>

<script>
// ==================== CONFIG ====================
const GITHUB_OWNER = "thexxx880";
const GITHUB_REPO = "apple";
const MOVIE_FOLDER = "movie";

// ==================== CARGAR PELÍCULAS ====================
async function loadMovies() {
  const container = document.getElementById("movies-container");
  const status = document.getElementById("status");
  const statusText = document.getElementById("status-text");

  try {
    // 1. Obtener lista de archivos de la carpeta movie/
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MOVIE_FOLDER}`);

    if (!res.ok) {
      throw new Error(`Error de GitHub: ${res.status} ${res.statusText}`);
    }

    const files = await res.json();
    const jsonFiles = files.filter(file => file.name.endsWith(".json"));

    if (jsonFiles.length === 0) {
      throw new Error("No se encontraron archivos JSON en la carpeta movie/");
    }

    container.innerHTML = ""; // Limpiar contenedor

    let loadedCount = 0;

    // 2. Cargar cada película
    for (const file of jsonFiles) {
      try {
        const movieRes = await fetch(file.download_url);
        const movie = await movieRes.json();

        if (!movie.id || !movie.titulo || !movie.poster) continue;

        // Crear tarjeta (mismo estilo del original)
        const article = document.createElement("article");
        article.className = "relative rounded-lg overflow-hidden cursor-pointer select-none";

        const link = `../../Peliculas/movie${movie.id}.html`;

        article.innerHTML = `
          <a href="${link}">
            <img src="${movie.poster}" 
                 alt="${movie.titulo}" 
                 class="w-full h-auto rounded-lg object-cover transition-transform duration-300 hover:scale-105"
                 loading="lazy"
                 onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Poster'"/>
            
            <div class="absolute top-2 right-2 bg-white/90 text-black text-xs font-semibold rounded-full px-2 py-0.5">
              Movie
            </div>
          </a>
          
          <div class="mt-2 font-semibold text-sm leading-tight truncate">${movie.titulo}</div>
          <div class="text-xs text-white/70">${movie.anio || 'N/A'}</div>
        `;

        container.appendChild(article);
        loadedCount++;

      } catch (err) {
        console.warn("Error cargando película:", file.name);
      }
    }

    // Ocultar loader
    status.style.display = "none";

    if (loadedCount === 0) {
      status.style.display = "flex";
      statusText.innerHTML = "No se pudieron cargar las películas.";
    }

  } catch (error) {
    console.error("Error completo:", error);
    statusText.innerHTML = `
      <span class="text-red-400 font-semibold">Error al cargar las películas</span><br>
      <span class="text-sm text-white/70">${error.message}</span><br><br>
      <button onclick="loadMovies()" 
              class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm transition">
        Reintentar
      </button>
    `;
  }
}

// Iniciar
window.onload = () => {
  loadMovies();
};
</script>

</body>
</html>
