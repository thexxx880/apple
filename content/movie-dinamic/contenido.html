<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Películas - Dinámico</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="bg-[#04143B] text-white">

  <div class="max-w-[1280px] mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold mb-6">Todas las Películas</h1>

    <!-- Estado de carga / error -->
    <div id="status" class="flex justify-center items-center py-10">
      <div class="flex items-center gap-3">
        <div class="w-6 h-6 border-4 border-white/20 border-t-[#4A7FFF] rounded-full animate-spin"></div>
        <span id="status-text">Cargando películas...</span>
      </div>
    </div>

    <!-- Contenedor de películas -->
    <div id="movies-container" 
         class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 hidden">
    </div>
  </div>

<script>
// ==================== CONFIG ====================
const GITHUB_OWNER = "thexxx880";
const GITHUB_REPO = "apple";
const MOVIE_FOLDER = "movie";

// ==================== FUNCIONES ====================

async function loadMovies() {
  const container = document.getElementById("movies-container");
  const status = document.getElementById("status");
  const statusText = document.getElementById("status-text");

  try {
    // Obtener lista de archivos
    const res = await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MOVIE_FOLDER}`);
    
    if (!res.ok) {
      throw new Error(`Error al conectar con GitHub (${res.status})`);
    }

    const files = await res.json();
    const jsonFiles = files.filter(f => f.name.endsWith(".json"));

    if (jsonFiles.length === 0) {
      throw new Error("No se encontraron archivos .json en la carpeta movie/");
    }

    // Cargar cada película
    const movies = [];
    
    for (const file of jsonFiles) {
      try {
        const movieRes = await fetch(file.download_url);
        const movieData = await movieRes.json();

        if (movieData.id && movieData.titulo && movieData.poster) {
          movies.push(movieData);
        }
      } catch (e) {
        console.warn("Error cargando:", file.name);
      }
    }

    // Ordenar por año
    movies.sort((a, b) => (b.anio || 0) - (a.anio || 0));

    // Renderizar
    container.innerHTML = "";
    movies.forEach(movie => {
      const card = createMovieCard(movie);
      container.appendChild(card);
    });

    // Mostrar contenido
    status.style.display = "none";
    container.classList.remove("hidden");

  } catch (error) {
    console.error("Error completo:", error);
    statusText.innerHTML = `
      <span class="text-red-400">Error al cargar las películas.</span><br>
      <span class="text-sm text-white/60">${error.message}</span><br><br>
      <button onclick="loadMovies()" 
              class="px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm">
        Reintentar
      </button>
    `;
  }
}

function createMovieCard(movie) {
  const article = document.createElement("article");
  article.className = "bg-[#0A1F4D] rounded-lg overflow-hidden cursor-pointer hover:scale-[1.02] transition-transform";

  const link = `../../Peliculas/movie${movie.id}.html`; // Cambia esta ruta cuando tengas la página dinámica

  article.innerHTML = `
    <a href="${link}">
      <img src="${movie.poster}" 
           alt="${movie.titulo}" 
           class="w-full aspect-[2/3] object-cover"
           onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Imagen'">
      
      <div class="p-3">
        <div class="font-semibold text-sm line-clamp-2 mb-1">${movie.titulo}</div>
        <div class="flex justify-between text-xs text-white/70">
          <span>${movie.anio || 'N/A'}</span>
          ${movie.calificacion ? `<span>★ ${movie.calificacion}</span>` : ''}
        </div>
      </div>
    </a>
  `;
  return article;
}

// Iniciar
window.onload = () => {
  loadMovies();
};
</script>

</body>
</html>
