<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Movies</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: "Poppins", sans-serif; }
    .movie-card { transition: transform 0.3s ease; }
    .movie-card:hover { transform: scale(1.03); }
  </style>
</head>
<body class="bg-[#04143B] text-white min-h-screen">

  <!-- Protección -->
  <div id="proteccion-loader" style="position:fixed;inset:0;background:#04143B;display:flex;align-items:center;justify-content:center;z-index:9999;">
    <div class="w-12 h-12 border-4 border-white/20 border-t-[#4A7FFF] rounded-full animate-spin"></div>
  </div>

  <header class="fixed top-0 left-0 w-full z-50 bg-[#04143B] flex items-center justify-between px-4 py-3 max-w-[1280px] mx-auto shadow-md">
    <!-- Tu header aquí -->
  </header>

  <main class="max-w-[1280px] mx-auto px-4 mt-24">
    <h1 class="text-3xl font-bold mb-6">Todas las Películas</h1>

    <!-- Contenedor dinámico -->
    <section id="movies-container" 
             class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4">
      <!-- Las películas se cargan aquí dinámicamente -->
    </section>

    <!-- Loader de películas -->
    <div id="loading" class="flex justify-center items-center py-10">
      <div class="w-8 h-8 border-4 border-white/20 border-t-[#4A7FFF] rounded-full animate-spin"></div>
      <span class="ml-3 text-white/70">Cargando películas...</span>
    </div>
  </main>

<script>
// ==================== CONFIG ====================
const GITHUB_OWNER = "thexxx880";
const GITHUB_REPO = "apple";
const MOVIE_FOLDER = "movie";



// ==================== CARGAR PELÍCULAS DESDE GITHUB ====================
async function loadMoviesFromGitHub() {
  const container = document.getElementById("movies-container");
  const loading = document.getElementById("loading");

  try {
    // 1. Obtener lista de archivos de la carpeta movie/
    const contentsUrl = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${MOVIE_FOLDER}`;
    const response = await fetch(contentsUrl);
    
    if (!response.ok) throw new Error("No se pudo cargar la lista de películas");

    const files = await response.json();

    // 2. Filtrar solo archivos .json
    const jsonFiles = files.filter(file => file.name.endsWith(".json"));

    if (jsonFiles.length === 0) {
      container.innerHTML = `<p class="text-center col-span-full text-white/60 py-10">No hay películas disponibles.</p>`;
      loading.style.display = "none";
      return;
    }

    // 3. Cargar cada JSON
    const movies = [];

    for (const file of jsonFiles) {
      try {
        const movieRes = await fetch(file.download_url);
        if (!movieRes.ok) continue;

        const movieData = await movieRes.json();

        // Validar que tenga los campos mínimos
        if (!movieData.id || !movieData.titulo || !movieData.poster) continue;

        movies.push(movieData);
      } catch (err) {
        console.warn(`Error cargando ${file.name}:`, err);
      }
    }

    // 4. Ordenar por año descendente (más nuevas primero)
    movies.sort((a, b) => (b.anio || 0) - (a.anio || 0));

    // 5. Renderizar las tarjetas
    container.innerHTML = "";

    movies.forEach(movie => {
      const article = createMovieCard(movie);
      container.appendChild(article);
    });

    loading.style.display = "none";

  } catch (error) {
    console.error(error);
    loading.innerHTML = `
      <div class="text-center col-span-full py-10">
        <p class="text-red-400">Error al cargar las películas.</p>
        <button onclick="loadMoviesFromGitHub()" 
                class="mt-4 px-4 py-2 bg-white/10 hover:bg-white/20 rounded-lg text-sm">
          Reintentar
        </button>
      </div>
    `;
  }
}

// ==================== CREAR TARJETA DE PELÍCULA ====================
function createMovieCard(movie) {
  const article = document.createElement("article");
  article.className = "relative rounded-lg overflow-hidden cursor-pointer select-none movie-card bg-[#0A1F4D]";

  // Enlace futuro (por ahora usamos placeholder)
  const link = `../../Peliculas/movie${movie.id}.html`;

  article.innerHTML = `
    <a href="${link}">
      <div class="relative">
        <img 
          src="${movie.poster}" 
          alt="${movie.titulo}" 
          class="w-full h-auto rounded-lg object-cover aspect-[2/3] transition-transform duration-300 hover:scale-105"
          loading="lazy"
          onerror="this.src='https://via.placeholder.com/300x450?text=Sin+Poster'"
        />
        
        <!-- Badge -->
        <div class="absolute top-2 right-2 bg-white/90 text-black text-xs font-semibold rounded-full px-2 py-0.5">
          Movie
        </div>
      </div>

      <div class="p-3">
        <div class="font-semibold text-sm leading-tight line-clamp-2 mb-1">
          ${movie.titulo}
        </div>
        <div class="text-xs text-white/70 flex items-center justify-between">
          <span>${movie.anio || 'N/A'}</span>
          ${movie.calificacion ? `<span class="flex items-center gap-1"><i class="fas fa-star text-yellow-400"></i> ${movie.calificacion}</span>` : ''}
        </div>
      </div>
    </a>
  `;

  return article;
}

// ==================== INICIAR ====================
window.onload = () => {
  loadMoviesFromGitHub();
};
</script>

</body>
</html>
