<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>player</title>
    <style>
        /* Reseteo y configuración global para pantalla completa */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000; /* Fondo negro ideal para cine */
            overflow: hidden; /* Evita barras de desplazamiento */
            position: fixed; /* Ayuda a que el iframe no se corte en móviles */
        }

        /* Configuración del iframe para ser totalmente responsivo */
        iframe {
            position: absolute; /* Para que ocupe todo el espacio disponible */
            top: 0;
            left: 0;
            width: 100vw; /* Ancho completo de la pantalla visible */
            height: 100vh; /* Alto completo de la pantalla visible */
            border: none;
            display: block; /* Evita espacios en blanco inferiores */
        }

        /* Estilo para mensajes de error */
        .error-message {
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Centrado perfecto */
            width: 80%;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- El iframe donde se cargará el reproductor de Powvideo -->
    <iframe id="videoPlayer" allowfullscreen allow="autoplay; fullscreen"></iframe>

    <script>
        // 1. Extraer los parámetros de la URL actual
        const params = new URLSearchParams(window.location.search);
        let videoUrl = params.get('url');

        const iframe = document.getElementById('videoPlayer');

        if (videoUrl) {
            // 2. Validación: Si la URL no trae protocolo (ej. "powvideo.com/1234"), se lo agregamos
            if (!videoUrl.startsWith('http://') && !videoUrl.startsWith('https://')) {
                videoUrl = 'https://' + videoUrl;
            }
            
            // 3. Asignar la URL procesada al iframe para que comience a cargar
            iframe.src = videoUrl;
        } else {
            // 4. Manejo de errores si alguien entra sin el parámetro ?url=
            iframe.style.display = 'none';
            document.body.innerHTML += '<div class="error-message">Error: No se ha proporcionado un enlace de video válido.</div>';
        }
    </script>

</body>
</html>
