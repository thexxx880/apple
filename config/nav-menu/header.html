<!-- ====================== HEADER DINÁMICO ====================== -->
<header id="lz-header" style="background: rgba(13,13,13,0.96); backdrop-filter: blur(14px); border-bottom: 1px solid rgba(255,255,255,0.08);">
  <div style="max-width: 100%; height: 68px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">

    
    <button onclick="history.back()" 
            style="background: none; border: none; color: #fff; font-size: 26px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <!-- CENTRO: Título de la película (opcional) -->
    <div style="font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; color: #fff; opacity: 0.95;">
      Godzilla Minus One
    </div>

    <!-- LADO DERECHO: Iconos -->
    <div style="display: flex; align-items: center; gap: 18px;">

      <!-- Buscador -->
      <button id="header-search-btn" 
              style="background: none; border: none; color: #ccc; font-size: 24px; cursor: pointer; transition: color 0.2s;">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>

      <!-- Favoritos -->
      <button onclick="toggleFavorite(this)" 
              style="background: none; border: none; color: #ccc; font-size: 24px; cursor: pointer; transition: color 0.2s;">
        <i class="fa-solid fa-heart"></i>
      </button>

      <!-- Icono de Usuario -->
      <button style="background: none; border: none; color: #ccc; font-size: 26px; cursor: pointer; transition: color 0.2s;">
        <i class="fa-solid fa-circle-user"></i>
      </button>

    </div>
  </div>
</header>

<script>
// Pequeño script para el botón de favoritos (cambio de color al hacer clic)
function toggleFavorite(btn) {
  const icon = btn.querySelector('i');
  if (icon.classList.contains('fa-heart')) {
    icon.classList.remove('fa-heart');
    icon.classList.add('fa-heart-circle-check');
    icon.style.color = '#ff2c6d';
  } else {
    icon.classList.remove('fa-heart-circle-check');
    icon.classList.add('fa-heart');
    icon.style.color = '#ccc';
  }
}

// Abrir el modal de búsqueda del bottom nav (si existe)
document.getElementById('header-search-btn').addEventListener('click', () => {
  const searchModal = document.getElementById('lz-search-modal');
  if (searchModal) {
    searchModal.style.display = 'flex';
    document.body.classList.add('lz-modal-open');
  } else {
    alert('Modal de búsqueda no encontrado');
  }
});
</script>
