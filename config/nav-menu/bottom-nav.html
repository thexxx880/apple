<!-- ====================== FONT AWESOME ====================== -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<!-- ====================== ESTILOS ====================== -->
<style>
/* ====================== SISTEMA BOTTOM BAR ====================== */
#lz-bottom-system {
    --bar-height: 68px;
}

/* ====================== BOTTOM BAR ====================== */
#lz-bottom-system .bottom-bar {
    position: fixed;
    bottom: 12px;
    left: 12px;
    right: 12px;
    height: var(--bar-height);
    display: flex;
    align-items: center;
    background: rgba(20, 20, 20, 0.88);
    backdrop-filter: blur(16px);
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    z-index: 9999;
    padding: 0 8px;
    transition: transform 0.3s ease, opacity 0.3s ease;
}

#lz-bottom-system .menu-link {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #aaa;
    font-size: 10.5px;
    line-height: 1.1;
    transition: color 0.25s ease;
}

#lz-bottom-system .menu-icon {
    font-size: 24px;
    margin-bottom: 3px;
    transition: transform 0.25s ease;
}

#lz-bottom-system .menu-link.active {
    color: #ff2c6d;
}

#lz-bottom-system .menu-link.active .menu-icon {
    transform: scale(1.25);
}

#lz-bottom-system .menu-link:hover {
    color: #ff2c6d;
}

#lz-bottom-system .menu-link:hover .menu-icon {
    transform: scale(1.2);
}

/* Responsive ajustes */
@media (max-width: 480px) {
    #lz-bottom-system .menu-icon {
        font-size: 22px;
    }
    #lz-bottom-system .menu-link {
        font-size: 10px;
    }
}

@media (min-width: 768px) {
    #lz-bottom-system .bottom-bar {
        display: none;
    }
}

/* ====================== MODAL ====================== */
#lz-bottom-system .search-modal {
    position: fixed;
    inset: 0;
    z-index: 100000;
    display: none;
    align-items: flex-start;
    justify-content: center;
    padding-top: 60px;
    background: rgba(0, 0, 0, 0.85);
}

#lz-bottom-system .modal-content {
    background: #1a1a1a;
    width: 92%;
    max-width: 520px;
    border-radius: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    overflow: hidden;
}

#lz-bottom-system .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 20px 12px;
    border-bottom: 1px solid #333;
}

#lz-bottom-system .modal-header h3 {
    margin: 0;
    color: #fff;
    font-size: 18px;
}

#lz-bottom-system .close-modal {
    background: none;
    border: none;
    font-size: 28px;
    color: #aaa;
    cursor: pointer;
}

/* ====================== BUSCADOR ====================== */
#lz-bottom-system .bb-search__wrapper {
    padding: 20px;
}

#lz-bottom-system .bb-search__field {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 56px;
    background: #222;
    border-radius: 16px;
    padding: 0 20px;
}

#lz-bottom-system .bb-search__field input {
    all: unset;
    flex: 1;
    color: #fff;
    font-size: 16px;
}

#lz-bottom-system .bb-search__field button {
    background: none;
    border: none;
    color: #ff2c6d;
    cursor: pointer;
}

#lz-bottom-system .bb-live-results {
    margin-top: 10px;
    background: #222;
    border-radius: 10px;
    max-height: 240px;
    overflow-y: auto;
    display: none;
}

#lz-bottom-system .bb-live-results.is-show {
    display: block;
}

#lz-bottom-system .bb-result-item {
    display: block;
    padding: 12px 16px;
    color: #fff;
    text-decoration: none;
}

#lz-bottom-system .bb-result-item:hover {
    background: #333;
}

.lz-modal-open {
    overflow: hidden !important;
}
</style>

<!-- ====================== HTML ====================== -->
<div id="lz-bottom-system">
    <!-- BOTTOM BAR -->
    <div class="bottom-bar">
        <a href="/search/label/Movie" class="menu-link">
            <i class="menu-icon fa-solid fa-film"></i>
            <span>Movies</span>
        </a>
        <a href="/search/label/Serie" class="menu-link">
            <i class="menu-icon fa-solid fa-tv"></i>
            <span>TvShows</span>
        </a>
        <div id="lz-search-trigger" class="menu-link">
            <i class="menu-icon fa-solid fa-magnifying-glass"></i>
            <span>Buscar</span>
        </div>
        <a href="/search/label/Anime" class="menu-link">
            <i class="menu-icon fa-solid fa-fire"></i>
            <span>Anime</span>
        </a>
        <a href="https://lzrdrz10.github.io/log/favoritos.html" class="menu-link">
            <i class="menu-icon fa-solid fa-heart"></i>
            <span>Favoritos</span>
        </a>
    </div>

    <!-- MODAL DE BÚSQUEDA -->
    <div id="lz-search-modal" class="search-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>🔎 Buscar</h3>
                <button class="close-modal" id="lz-close-modal">✕</button>
            </div>
            <form action="/search" class="bb-search__wrapper">
                <div class="bb-search__field">
                    <input type="text" name="q" placeholder="Buscar..." />
                    <button type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>
            </form>
            <div class="bb-live-results"></div>
        </div>
    </div>
</div>

<!-- ====================== JAVASCRIPT ====================== -->
<script>
(function(){
    const system = document.getElementById("lz-bottom-system");
    if(!system) return;

    const modal = system.querySelector("#lz-search-modal");
    const openBtn = system.querySelector("#lz-search-trigger");
    const closeBtn = system.querySelector("#lz-close-modal");
    const input = system.querySelector("input[name='q']");
    const results = system.querySelector(".bb-live-results");
    const bar = system.querySelector(".bottom-bar");

    /* ================= MODAL ================= */
    openBtn.onclick = () => {
        modal.style.display = "flex";
        document.documentElement.classList.add("lz-modal-open");
        setTimeout(() => input.focus(), 150);
    };

    closeBtn.onclick = closeModal;
    
    function closeModal(){
        modal.style.display = "none";
        document.documentElement.classList.remove("lz-modal-open");
    }

    modal.addEventListener("click", e => {
        if(e.target === modal) closeModal();
    });

    document.addEventListener("keydown", e => {
        if(e.key === "Escape") closeModal();
    });

    /* ================= BUSCADOR ================= */
    let timeout;
    input.addEventListener("input", () => {
        clearTimeout(timeout);
        const q = input.value.trim();
        if(!q){
            results.classList.remove("is-show");
            results.innerHTML = "";
            return;
        }
        timeout = setTimeout(async () => {
            try{
                const res = await fetch(`/feeds/posts/summary?alt=json&q=${encodeURIComponent(q)}&max-results=5`);
                const data = await res.json();
                const entries = data.feed.entry || [];
                results.innerHTML = entries.length
                    ? entries.map(e => {
                        const title = e.title.$t;
                        const link = e.link.find(l => l.rel === "alternate").href;
                        return `<a class="bb-result-item" href="${link}">${title}</a>`;
                      }).join("")
                    : "<div class='bb-result-item'>Sin resultados</div>";
                results.classList.add("is-show");
            } catch{
                results.innerHTML = "<div class='bb-result-item'>Error al buscar</div>";
                results.classList.add("is-show");
            }
        }, 300);
    });

    /* ================= AUTO HIDE BAR ================= */
    let lastScroll = 0;
    window.addEventListener("scroll", () => {
        const current = window.pageYOffset;
        if(current > lastScroll && current > 50){
            bar.style.transform = "translateY(120%)";
            bar.style.opacity = "0";
        } else {
            bar.style.transform = "translateY(0)";
            bar.style.opacity = "1";
        }
        lastScroll = current;
    });
})();
</script>
