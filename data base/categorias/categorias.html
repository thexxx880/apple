<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Películas - LZPLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: #020817;
            color: white;
        }
        
        .page-content { padding-top: 8rem; }
        @media (max-width: 768px) { .page-content { padding-top: 5rem; } }

        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: scale(1.06);
            box-shadow: 0 20px 40px rgba(0,0,0,.45);
        }

        .poster-container {
            position: relative;
            overflow: hidden;
            background: #111827;
        }

        .rating {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(8px);
        }

        .categoria-btn.active {
            background: #2563eb !important;
            color: white !important;
        }

        /* Botón flotante */
        .fab {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: #2563eb;
            color: white;
            border-radius: 9999px;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            z-index: 9999;
            transition: all 0.3s ease;
        }
        .fab:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(37, 99, 235, 0.5);
        }

        .modal {
            animation: modalPop 0.2s ease forwards;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="min-h-screen pb-12">

    <!-- NAVBAR -->
    <header id="main-header"></header>

    <div class="page-content max-w-screen-2xl mx-auto px-6">
        
        <!-- LOADING -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="animate-spin w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
            <p class="text-zinc-400">Cargando películas...</p>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div id="contenido-principal" class="hidden">
            
            <!-- HEADER + FILTRO -->
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
                <div>
                    <h1 class="text-4xl font-bold">Películas</h1>
                    <p class="text-zinc-400 mt-1" id="total-contenido">Cargando...</p>
                </div>

                <!-- BOTÓN FILTRAR -->
                <button onclick="abrirModalFiltros()"
                        class="flex items-center gap-3 px-6 py-3 bg-white/10 hover:bg-white/20 border border-white/10 rounded-3xl text-sm font-medium transition-all">
                    <i class="fas fa-filter"></i>
                    <span>Filtrar</span>
                </button>
            </div>

            <!-- GRID DE PELÍCULAS -->
            <div id="grid-peliculas" 
                 class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 2xl:grid-cols-7 gap-6">
                <!-- Se llena con JS -->
            </div>

            <!-- BOTÓN CARGAR MÁS -->
            <div class="flex justify-center mt-10">
                <button id="btn-cargar-mas"
                        onclick="cargarMas()"
                        class="hidden px-10 py-3 bg-white/10 hover:bg-white/20 border border-white/10 rounded-3xl text-sm font-medium flex items-center gap-3">
                    <span>Cargar más</span>
                    <i class="fas fa-chevron-down"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- BOTÓN FLOTANTE VOLVER ARRIBA -->
    <button onclick="volverArriba()" 
            class="fab hidden" id="btn-volver-arriba">
        <i class="fas fa-arrow-up"></i>
    </button>

    <!-- MODAL DE FILTROS -->
    <div id="modal-filtros" onclick="cerrarModalFiltros()" 
         class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm z-[10000] flex items-center justify-center">
        <div onclick="event.stopImmediatePropagation()" 
             class="modal bg-[#020817] border border-white/10 rounded-3xl w-full max-w-md mx-4 overflow-hidden">
            
            <!-- Header del modal -->
            <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">
                <h3 class="text-xl font-semibold">Filtrar películas</h3>
                <button onclick="cerrarModalFiltros()" class="text-3xl text-zinc-400 hover:text-white">×</button>
            </div>

            <div class="p-6 space-y-8">
                
                <!-- Buscar por nombre -->
                <div>
                    <label class="block text-sm text-zinc-400 mb-2">Buscar por nombre</label>
                    <input type="text" id="filtro-nombre" 
                           class="w-full bg-[#111827] border border-white/10 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500"
                           placeholder="Ej: Avatar, Dune...">
                </div>

                <!-- Categorías -->
                <div>
                    <label class="block text-sm text-zinc-400 mb-3">Categorías</label>
                    <div id="filtro-categorias" class="flex flex-wrap gap-2 max-h-40 overflow-y-auto pr-2">
                        <!-- Se generan dinámicamente -->
                    </div>
                </div>

                <!-- Letra -->
                <div>
                    <label class="block text-sm text-zinc-400 mb-3">Empieza con la letra</label>
                    <div class="flex flex-wrap gap-2" id="filtro-letras">
                        <!-- Se generan con JS -->
                    </div>
                </div>

                <!-- Año -->
                <div>
                    <label class="block text-sm text-zinc-400 mb-2">Año</label>
                    <div class="flex gap-3">
                        <select id="filtro-ano-min" class="flex-1 bg-[#111827] border border-white/10 rounded-2xl px-4 py-3 text-sm">
                            <option value="">Desde</option>
                        </select>
                        <select id="filtro-ano-max" class="flex-1 bg-[#111827] border border-white/10 rounded-2xl px-4 py-3 text-sm">
                            <option value="">Hasta</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 p-6 border-t border-white/10">
                <button onclick="limpiarFiltros()" 
                        class="flex-1 py-3 text-sm border border-white/20 rounded-2xl hover:bg-white/5 transition-all">
                    Limpiar
                </button>
                <button onclick="aplicarFiltros()" 
                        class="flex-1 py-3 text-sm bg-blue-600 hover:bg-blue-700 rounded-2xl transition-all">
                    Aplicar filtros
                </button>
            </div>
        </div>
    </div>

    <script src="../js/components/navbar.js"></script>
    <script>
        // ====================== CONFIG ======================
        const TMDB_API_KEY = "38e497c6c1a043d1341416e80915669f";
        const BASE_JSON_URL = "https://raw.githubusercontent.com/thexxx880/apple/main/data%20base/data/base/base.json";

        let todosLosContenidos = [];
        let contenidosFiltrados = [];
        let displayedCount = 15;
        let observer; // Intersection Observer

        // ====================== FUNCIONES TMDB ======================
        async function fetchTMDB(endpoint) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/${endpoint}${endpoint.includes('?') ? '&' : '?'}api_key=${TMDB_API_KEY}&language=es-ES`);
                return res.ok ? await res.json() : null;
            } catch (e) { return null; }
        }

        // ====================== CARGAR DATOS ======================
        async function cargarTodo() {
            const loading = document.getElementById("loading");
            const principal = document.getElementById("contenido-principal");

            loading.classList.remove("hidden");
            principal.classList.add("hidden");

            try {
                const baseRes = await fetch(BASE_JSON_URL);
                const baseData = await baseRes.json();
                const ids = Object.keys(baseData);

                const promesas = ids.map(async (id) => {
                    const detalle = await fetchTMDB(`movie/${id}`);
                    if (!detalle) return null;

                    return {
                        id: parseInt(id),
                        url: baseData[id],
                        title: detalle.title || detalle.name,
                        poster: detalle.poster_path ? `https://image.tmdb.org/t/p/w500${detalle.poster_path}` : null,
                        year: detalle.release_date ? detalle.release_date.split("-")[0] : "N/A",
                        rating: detalle.vote_average ? detalle.vote_average.toFixed(1) : "0.0",
                        genres: detalle.genres || []
                    };
                });

                const resultados = await Promise.all(promesas);
                todosLosContenidos = resultados.filter(item => item !== null);
                
                document.getElementById("total-contenido").textContent = `${todosLosContenidos.length} películas`;

                // Inicializar filtros
                inicializarFiltrosModal();

                // Mostrar "Todos" por defecto
                contenidosFiltrados = [...todosLosContenidos];
                renderizarPeliculas();

                loading.classList.add("hidden");
                principal.classList.remove("hidden");

            } catch (error) {
                loading.innerHTML = `<p class="text-red-400">Error al cargar películas</p>`;
                console.error(error);
            }
        }

        // ====================== RENDERIZAR PELÍCULAS (15 en 15 + Lazy Load) ======================
        function renderizarPeliculas(reset = true) {
            const grid = document.getElementById("grid-peliculas");
            const btnCargarMas = document.getElementById("btn-cargar-mas");

            if (reset) {
                grid.innerHTML = "";
                displayedCount = 15;
            }

            const porMostrar = contenidosFiltrados.slice(0, displayedCount);

            porMostrar.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "card cursor-pointer group";
                card.innerHTML = `
                    <div class="poster-container rounded-3xl overflow-hidden shadow-2xl border border-white/10">
                        <img data-src="${item.poster || 'https://via.placeholder.com/500x750?text=Sin+Poster'}" 
                             alt="${item.title}" 
                             class="w-full aspect-[2/3] object-cover transition-transform group-hover:scale-110 lazy-image">
                        
                        <div class="rating absolute top-3 right-3 flex items-center gap-1 text-xs font-bold px-2.5 py-1 rounded-2xl">
                            <i class="fas fa-star text-yellow-400"></i>
                            <span>${item.rating}</span>
                        </div>
                    </div>
                    
                    <div class="mt-3 px-1">
                        <h3 class="font-semibold text-base line-clamp-2 leading-tight group-hover:text-blue-400 transition-colors">
                            ${item.title}
                        </h3>
                        <div class="flex items-center justify-between text-xs text-zinc-400 mt-2">
                            <span>${item.year}</span>
                            <span class="flex items-center gap-1">
                                <i class="fas fa-film text-[10px]"></i> Película
                            </span>
                        </div>
                    </div>
                `;

                card.onclick = () => window.open(item.url, "_blank");
                grid.appendChild(card);
            });

            // Activar Intersection Observer para imágenes
            activarLazyLoading();

            // Mostrar/ocultar botón "Cargar más"
            if (displayedCount < contenidosFiltrados.length) {
                btnCargarMas.classList.remove("hidden");
                btnCargarMas.classList.add("flex");
            } else {
                btnCargarMas.classList.add("hidden");
            }
        }

        function cargarMas() {
            displayedCount += 15;
            renderizarPeliculas(false);
        }

        // ====================== LAZY LOADING CON INTERSECTION OBSERVER ======================
        function activarLazyLoading() {
            if (observer) observer.disconnect();

            observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        img.classList.remove("lazy-image");
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: "200px" }); // Carga 200px antes de entrar en pantalla

            document.querySelectorAll(".lazy-image").forEach(img => {
                observer.observe(img);
            });
        }

        // ====================== MODAL DE FILTROS ======================
        function abrirModalFiltros() {
            document.getElementById("modal-filtros").classList.remove("hidden");
            document.getElementById("modal-filtros").classList.add("flex");
        }

        function cerrarModalFiltros() {
            document.getElementById("modal-filtros").classList.add("hidden");
            document.getElementById("modal-filtros").classList.remove("flex");
        }

        function inicializarFiltrosModal() {
            // Letras A-Z
            const letrasContainer = document.getElementById("filtro-letras");
            letrasContainer.innerHTML = "";
            for (let i = 65; i <= 90; i++) {
                const letra = String.fromCharCode(i);
                const btn = document.createElement("button");
                btn.className = "px-3 py-1 text-xs bg-white/10 hover:bg-white/20 rounded-xl border border-white/10";
                btn.textContent = letra;
                btn.onclick = () => {
                    btn.classList.toggle("bg-blue-600");
                    btn.classList.toggle("text-white");
                };
                letrasContainer.appendChild(btn);
            }

            // Años
            const anos = [...new Set(todosLosContenidos.map(c => c.year))].sort((a, b) => b - a);
            const minSelect = document.getElementById("filtro-ano-min");
            const maxSelect = document.getElementById("filtro-ano-max");

            minSelect.innerHTML = `<option value="">Desde</option>` + anos.map(a => `<option value="${a}">${a}</option>`).join("");
            maxSelect.innerHTML = `<option value="">Hasta</option>` + anos.map(a => `<option value="${a}">${a}</option>`).join("");

            // Categorías
            const catsContainer = document.getElementById("filtro-categorias");
            catsContainer.innerHTML = "";
            const categoriasUnicas = [...new Set(todosLosContenidos.flatMap(c => c.genres.map(g => g.name)))].sort();

            categoriasUnicas.forEach(cat => {
                const div = document.createElement("div");
                div.className = "px-4 py-1.5 text-xs bg-white/10 hover:bg-white/20 rounded-2xl cursor-pointer border border-white/10";
                div.textContent = cat;
                div.onclick = () => div.classList.toggle("bg-blue-600");
                catsContainer.appendChild(div);
            });
        }

        function aplicarFiltros() {
            const nombre = document.getElementById("filtro-nombre").value.toLowerCase().trim();
            const letrasActivas = Array.from(document.querySelectorAll("#filtro-letras button.bg-blue-600")).map(b => b.textContent);
            const anoMin = document.getElementById("filtro-ano-min").value;
            const anoMax = document.getElementById("filtro-ano-max").value;
            const catsActivas = Array.from(document.querySelectorAll("#filtro-categorias div.bg-blue-600")).map(d => d.textContent);

            contenidosFiltrados = todosLosContenidos.filter(item => {
                // Nombre
                if (nombre && !item.title.toLowerCase().includes(nombre)) return false;

                // Letra
                if (letrasActivas.length > 0 && !letrasActivas.includes(item.title[0].toUpperCase())) return false;

                // Año
                if (anoMin && item.year < anoMin) return false;
                if (anoMax && item.year > anoMax) return false;

                // Categorías
                if (catsActivas.length > 0) {
                    const itemCats = item.genres.map(g => g.name);
                    if (!catsActivas.some(cat => itemCats.includes(cat))) return false;
                }

                return true;
            });

            cerrarModalFiltros();
            renderizarPeliculas(true);
        }

        function limpiarFiltros() {
            document.getElementById("filtro-nombre").value = "";
            document.querySelectorAll("#filtro-letras button").forEach(b => b.classList.remove("bg-blue-600", "text-white"));
            document.getElementById("filtro-ano-min").value = "";
            document.getElementById("filtro-ano-max").value = "";
            document.querySelectorAll("#filtro-categorias div").forEach(d => d.classList.remove("bg-blue-600"));

            contenidosFiltrados = [...todosLosContenidos];
            cerrarModalFiltros();
            renderizarPeliculas(true);
        }

        // ====================== BOTÓN VOLVER ARRIBA ======================
        function volverArriba() {
            window.scrollTo({ top: 0, behavior: "smooth" });
        }

        // Mostrar/Ocultar botón flotante
        window.addEventListener("scroll", () => {
            const btn = document.getElementById("btn-volver-arriba");
            if (window.scrollY > 400) {
                btn.classList.remove("hidden");
                btn.classList.add("flex");
            } else {
                btn.classList.add("hidden");
                btn.classList.remove("flex");
            }
        });

        // ====================== INICIAR ======================
        window.onload = () => {
            if (typeof initNavbar === "function") {
                initNavbar("main-header");
            }
            cargarTodo();
        };
    </script>
</body>
</html>
