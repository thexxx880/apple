<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - LZ Play HD</title>
    
    <!-- === TUS CSS EXACTOS (igual que en index.html) === -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
    
    <!-- Font Awesome y Poppins (ya lo usas) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            background: #020817;
        }
        .categorias-container {
            padding: 40px 70px;
        }
        .section {
            margin-bottom: 70px;
        }
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .section-title {
            font-size: 2.4rem;
            font-weight: 700;
            color: #fff;
        }
        .movies-grid {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 25px;
            scroll-behavior: smooth;
        }
        .movies-grid::-webkit-scrollbar {
            display: none;
        }
        /* Aseguramos que las cards sean exactamente como en tu home */
        .movie-card {
            min-width: 200px;
            max-width: 200px;
            height: 300px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            background: #111827;
            position: relative;
        }
        .movie-card:hover {
            transform: scale(1.05);
        }
        .movie-overlay {
            padding: 16px;
        }
        .movie-title {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
            color: white;
        }
        .loading-spinner {
            border: 4px solid #2563eb;
            border-top-color: transparent;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Header simple (igual estilo que tu sitio) -->
    <div style="background:#0a1428; padding:25px 70px; border-bottom:1px solid #1e2937; display:flex; align-items:center; gap:15px;">
        <div style="width:42px; height:42px; background:linear-gradient(#2563eb, #3b82f6); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700;">LZ</div>
        <h1 style="font-size:2.1rem; font-weight:700; margin:0;">Categorías</h1>
        <div style="margin-left:auto; font-size:0.95rem; color:#64748b; display:flex; align-items:center; gap:8px;">
            <i class="fas fa-sync-alt"></i>
            <span onclick="location.reload()" style="cursor:pointer;">Actualizar</span>
        </div>
    </div>

    <div class="categorias-container">
        
        <!-- LOADING -->
        <div id="loading" style="text-align:center; padding:120px 20px;">
            <div class="loading-spinner mx-auto mb-6"></div>
            <p style="color:#64748b; font-size:1.1rem;">Cargando tu base.json + datos de TMDB...</p>
        </div>

        <!-- CONTENIDO -->
        <div id="content" class="hidden"></div>
    </div>

    <script>
        // ====================== TMDB (exacto igual a tu tmdb.js) ======================
        const TMDB_API_KEY = "38e497c6c1a043d1341416e80915669f";

        async function fetchTMDB(endpoint) {
            try {
                const response = await fetch(
                    `https://api.themoviedb.org/3/${endpoint}${
                        endpoint.includes("?") ? "&" : "?"
                    }api_key=${TMDB_API_KEY}&language=es-ES`
                );
                if (!response.ok) throw new Error("Error en TMDB");
                return await response.json();
            } catch (error) {
                console.error("TMDB Error:", error);
                return null;
            }
        }

        // ====================== CÍRCULO DE CALIFICACIÓN (exacto igual que en tu home.js) ======================
        function createRatingCircle(rating) {
            if (!rating) rating = 0;
            const percent = Math.min(Math.max(rating * 10, 0), 100);
            const circumference = 144.5; // 2 * π * 23
            const offset = circumference - (percent / 100 * circumference);

            return `
                <svg class="rating-circle" width="52" height="52" viewBox="0 0 52 52">
                    <circle class="bg" cx="26" cy="26" r="23" stroke="#1e2937" stroke-width="5" fill="none"/>
                    <circle class="progress" cx="26" cy="26" r="23" 
                            stroke="#22c55e" stroke-width="5" fill="none"
                            stroke-dasharray="${circumference}" 
                            stroke-dashoffset="${offset}"
                            stroke-linecap="round"/>
                </svg>
                <div class="rating-value">${rating.toFixed(1)}</div>
            `;
        }

        // ====================== URL DE TU BASE.JSON (ruta relativa desde categorias.html) ======================
        const BASE_JSON_URL = "data base/data/base/base.json";   // ← Cambia si tu ruta es diferente

        let allContents = [];

        // ====================== CARGAR TODO ======================
        async function cargarCategorias() {
            const loading = document.getElementById('loading');
            const container = document.getElementById('content');

            try {
                // 1. Cargar tu base.json
                const baseRes = await fetch(BASE_JSON_URL);
                if (!baseRes.ok) throw new Error("No se pudo cargar base.json");
                const baseData = await baseRes.json();

                const ids = Object.keys(baseData);

                // 2. Cargar datos de TMDB
                const promesas = ids.map(async (id) => {
                    const movie = await fetchTMDB(`movie/${id}`);
                    if (!movie) return null;

                    return {
                        id: parseInt(id),
                        url: baseData[id],
                        titulo: movie.title || "Sin título",
                        poster: movie.poster_path 
                            ? `https://image.tmdb.org/t/p/w500${movie.poster_path}` 
                            : "https://via.placeholder.com/500x750?text=Sin+Poster",
                        calificacion: movie.vote_average || 0,
                        anio: movie.release_date ? movie.release_date.substring(0,4) : "N/A",
                        genres: movie.genres || []
                    };
                });

                const resultados = await Promise.all(promesas);
                allContents = resultados.filter(item => item !== null);

                // 3. Agrupar por categorías (géneros de TMDB)
                const categoriasMap = {};
                allContents.forEach(item => {
                    if (item.genres.length === 0) {
                        if (!categoriasMap["Otros"]) categoriasMap["Otros"] = [];
                        categoriasMap["Otros"].push(item);
                    } else {
                        item.genres.forEach(genre => {
                            if (!categoriasMap[genre.name]) categoriasMap[genre.name] = [];
                            categoriasMap[genre.name].push(item);
                        });
                    }
                });

                // Ordenar categorías por cantidad de contenidos
                const categoriasOrdenadas = Object.keys(categoriasMap)
                    .sort((a, b) => categoriasMap[b].length - categoriasMap[a].length);

                // 4. Renderizar secciones (estilo idéntico a tu home)
                let html = '';
                categoriasOrdenadas.forEach(nombre => {
                    const items = categoriasMap[nombre];
                    html += `
                    <div class="section">
                        <div class="section-header">
                            <h2 class="section-title">${nombre}</h2>
                            <span style="color:#4f7cff; font-size:1rem; cursor:pointer;" onclick="verTodo('${nombre}')">
                                Ver todo (${items.length})
                            </span>
                        </div>
                        
                        <div class="movies-grid">
                            ${items.map(item => `
                                <div class="movie-card" onclick="abrirContenido('${item.url}')">
                                    <img src="${item.poster}" alt="${item.titulo}" style="width:100%; height:100%; object-fit:cover;">
                                    <div class="movie-rating">
                                        ${createRatingCircle(item.calificacion)}
                                    </div>
                                    <div class="movie-overlay">
                                        <div class="movie-title">${item.titulo}</div>
                                        <div style="font-size:0.85rem; color:#94a3b8; margin-top:4px;">${item.anio}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>`;
                });

                container.innerHTML = html || `<p style="text-align:center; color:#f87171; padding:80px 20px;">No se encontraron contenidos válidos.</p>`;
                
                loading.classList.add('hidden');
                container.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                loading.innerHTML = `
                    <p style="color:#f87171; font-size:1.2rem;">⚠️ Error al cargar</p>
                    <p style="color:#64748b;">${error.message}</p>
                    <button onclick="location.reload()" style="margin-top:30px; padding:14px 32px; background:#2563eb; color:white; border:none; border-radius:50px; cursor:pointer;">
                        Intentar de nuevo
                    </button>`;
            }
        }

        function abrirContenido(url) {
            window.location.href = url;
        }

        function verTodo(nombre) {
            alert(`Mostrando todos los contenidos de la categoría "${nombre}"\n\n(En una futura versión se puede filtrar solo esta categoría)`);
            // Aquí podrías añadir filtro si quieres
        }

        // ====================== INICIAR ======================
        document.addEventListener('DOMContentLoaded', cargarCategorias);
    </script>
</body>
</html>
