 <script>

/* ==========================
MI LISTA FIREBASE
========================== */

let isSaved = false;

/* ==========================
INICIAR
========================== */

document.addEventListener(
"DOMContentLoaded",
()=>{

firebase.auth()
.onAuthStateChanged(
async(user)=>{

if(!user){

console.log(
"No hay sesión iniciada"
);

return;
}

await verificarMiLista();

const listBtn =
document.getElementById(
"listBtn"
);

if(listBtn){

listBtn.addEventListener(
"click",
toggleList
);

}

});

});

/* ==========================
VERIFICAR SI YA ESTÁ
EN MI LISTA
========================== */

async function verificarMiLista(){

const user =
firebase.auth()
.currentUser;

if(!user) return;

const params =
new URLSearchParams(
window.location.search
);

const tmdbId =
params.get("id");

if(!tmdbId) return;

try{

const doc =
await firebase
.firestore()
.collection("users")
.doc(user.uid)
.collection("myList")
.doc(tmdbId)
.get();

const btn =
document.getElementById(
"listBtn"
);

if(!btn) return;

if(doc.exists){

isSaved = true;

btn.innerHTML = `
<i class="fa-solid fa-bookmark"></i>
<span>Guardado</span>
`;

}else{

isSaved = false;

btn.innerHTML = `
<i class="fa-regular fa-bookmark"></i>
<span>Mi lista</span>
`;

}

}catch(error){

console.error(
"Error verificando Mi Lista:",
error
);

}

}

/* ==========================
GUARDAR / ELIMINAR
========================== */

async function toggleList(){

const user =
firebase.auth()
.currentUser;

if(!user){

window.location.href =
"https://lzplayhd.online/apple/login.html";

return;
}

const params =
new URLSearchParams(
window.location.search
);

const tmdbId =
params.get("id");

const mediaType =
params.get("type")
|| "movie";

if(!tmdbId){

alert(
"Contenido no encontrado"
);

return;
}

const btn =
document.getElementById(
"listBtn"
);

try{

const docRef =
firebase.firestore()
.collection("users")
.doc(user.uid)
.collection("myList")
.doc(tmdbId);

/* ==========================
ELIMINAR
========================== */

if(isSaved){

await docRef.delete();

isSaved = false;

btn.innerHTML = `
<i class="fa-regular fa-bookmark"></i>
<span>Mi lista</span>
`;

console.log(
"🗑 Eliminado de Mi Lista"
);

return;
}

/* ==========================
GUARDAR
========================== */

await docRef.set({

id:
Number(tmdbId),

type:
mediaType,

url:
window.location.href,

addedAt:
firebase.firestore
.FieldValue
.serverTimestamp()

});

isSaved = true;

btn.innerHTML = `
<i class="fa-solid fa-bookmark"></i>
<span>Guardado</span>
`;

console.log(
"✅ Guardado en Mi Lista"
);

}catch(error){

console.error(
"Error guardando:",
error
);

alert(
"Error guardando en Mi Lista"
);

}

}

</script>
<script>
function toggleCrew() {
    const section =
    document.getElementById(
        'crewSection'
    );
    const btn =
    document.getElementById(
        'crewToggleBtn'
    );
    if (
        section.style.display
        === 'none'
    ) {
        section.style.display =
        'block';
        btn.innerHTML =
        `
        <i class="fa-solid fa-chevron-up"></i>
        Ocultar equipo creativo
        `;
    } else {
        section.style.display =
        'none';
        btn.innerHTML =
        `
        <i class="fa-solid fa-users"></i>
        Ver detalles del equipo creativo
        `;
    }
}

function limpiarUndefinedEnCrew() {
    const crewGrid =
    document.getElementById(
        'crewGrid'
    );
    if (!crewGrid) return;
    setTimeout(() => {
        const items =
        crewGrid.querySelectorAll(
            '.crew-item, div'
        );
        items.forEach(item => {
            const text =
            item.textContent.trim();
            if (
                text === 'undefined' ||
                text === '' ||
                text.includes(
                    'undefined'
                )
            ) {
                item.style.display =
                'none';
            }
        });
    }, 800);
}

/* ==========================
CARGAR RATING TMDB
========================== */
async function loadTMDBRating() {
    const urlParams =
    new URLSearchParams(
        window.location.search
    );
    const tmdbId =
    urlParams.get('id') ||
    urlParams.get('tmdb_id');
    const mediaType =
    urlParams.get('type') ||
    urlParams.get('media_type') ||
    'movie';
    const ratingNumber =
    document.getElementById(
        'ratingNumber'
    );
    const ratingBars =
    document.getElementById(
        'ratingBars'
    );
    if (!tmdbId) {
        ratingNumber.textContent =
        '—';
        return;
    }
    try {
        const data =
        await fetchTMDB(
            `${mediaType}/${tmdbId}`
        );
        if (!data) {
            ratingNumber.textContent =
            '—';
            return;
        }
        const voteAverage =
        data.vote_average
        ? data.vote_average.toFixed(1)
        : '—';
        ratingNumber.textContent =
        voteAverage;
        if (data.vote_count) {
            ratingBars.innerHTML =
            `
            <div style="font-size:0.85rem; color:#aaa; margin-top:8px;">
                Basado en
                <strong>
                ${data.vote_count.toLocaleString('es-ES')}
                </strong>
                valoraciones en TMDB
            </div>
            `;
        }
    } catch (error) {
        console.error(
            'Error TMDB rating:',
            error
        );
        ratingNumber.textContent =
        '—';
    }
}

/* ==========================
INICIAR
========================== */
document.addEventListener(
    'DOMContentLoaded',
    () => {
        const btn =
        document.getElementById(
            'crewToggleBtn'
        );
        if (btn) {
            btn.addEventListener(
                'click',
                toggleCrew
            );
        }
        window.addEventListener(
            'load',
            limpiarUndefinedEnCrew
        );
        loadTMDBRating();
        
    }
);
</script>
