<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contenido.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

   <script src="js/firebase/applelz.js"></script>
</head>
<body>
    <!-- HEADER -->
    <header id="main-header"></header>
    
    <!-- HERO -->
    <section class="hero" id="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-eyebrow" id="heroEyebrow"></div>
            <div class="hero-logo" id="heroLogo"></div>
            <div class="hero-meta" id="heroMeta"></div>
           
            <div class="hero-cta">
                <button class="btn-play" id="playBtn">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                    <span id="playText">Reproducir</span>
                </button>
               
                <button class="btn-secondary" id="trailerBtn">
                    <i class="fa-solid fa-film"></i> Trailer
                </button>
            </div>
           
            <div class="hero-actions">
                <button class="action-pill" id="likeBtn"><i class="fa-regular fa-thumbs-up"></i><span>Me gusta</span></button>
        <button class="action-pill" id="listBtn">
    <i class="fa-regular fa-bookmark"></i>
    <span>Mi lista</span>
</button>
             </div>
        </div>
    </section>

    <div class="content">
        <div class="description-block">
            <p id="sinopsis">Cargando sinopsis...</p>
            <div class="genres" id="generos"></div>
        </div>
        <div class="stats-row" id="statsRow"></div>

        <!-- REPARTO -->
        <div class="section-header"><h2 class="section-title">Reparto</h2></div>
        <div class="cast-scroll" id="castScroll"></div>

        <!-- BOTÓN PARA MOSTRAR EQUIPO CREATIVO -->
        <button id="crewToggleBtn" class="btn-secondary" style="margin: 30px 0 15px; width: 100%; max-width: 320px; display: block; margin-left: auto; margin-right: auto;">
            <i class="fa-solid fa-users"></i> Ver detalles del equipo creativo
        </button>

        <!-- EQUIPO CREATIVO (oculto por defecto) -->
        <div id="crewSection" style="display: none;">
            <div class="section-header"><h2 class="section-title">Equipo creativo</h2></div>
            <div class="crew-grid" id="crewGrid"></div>
        </div>

        <!-- VALORACIONES (TMDB) -->
        <div class="section-header"><h2 class="section-title">Valoraciones</h2></div>
        <div class="rating-block">
            <div class="rating-big">
                <div class="rating-number" id="ratingNumber">—</div>
                <small id="ratingSource" style="display:block; font-size:0.8rem; color:#aaa; margin-top:4px;">TMDB</small>
            </div>
            <div class="rating-bars" id="ratingBars"></div>
        </div>
    </div>

    <!-- FLOATING MENU -->
    <div id="floating-container"></div>

    <!-- MODAL DE REPRODUCTORES -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Elige tu reproductor</h3>
                <span class="close-modal" onclick="closeModal()">✕</span>
            </div>
            <div class="modal-body">
                <div class="player-option" onclick="openPlayer(1)">
                    <i class="fa-solid fa-play-circle"></i>
                    <div>
                        <strong>Reproductor 1 (LzPro)</strong>
                        <p>Rápido y ligero</p>
                    </div>
                </div>
                <div class="player-option" onclick="openPlayer(2)">
                    <i class="fa-solid fa-play-circle"></i>
                    <div>
                        <strong>Reproductor 2 (Premium)</strong>
                        <p>Calidad superior</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/app/home.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/floating-menu.js"></script>
    <script src="js/app/contenido.js"></script>
    <script src="js/main.js"></script>
    <script>

let isSaved = false;

document.addEventListener("DOMContentLoaded", () => {

    firebase.auth().onAuthStateChanged(async(user)=>{

        if(!user) return;

        await verificarMiLista();

        document
        .getElementById("listBtn")
        .addEventListener(
            "click",
            toggleList
        );

    });

});

/* ==========================
   VERIFICAR SI YA EXISTE
========================== */

async function verificarMiLista(){

    const user =
    firebase.auth().currentUser;

    if(!user) return;

    const params =
    new URLSearchParams(
        location.search
    );

    const tmdbId =
    params.get("id");

    if(!tmdbId) return;

    try{

        const doc =
        await firebase.firestore()
        .collection("users")
        .doc(user.uid)
        .collection("myList")
        .doc(tmdbId)
        .get();

        const btn =
        document.getElementById(
            "listBtn"
        );

        if(doc.exists){

            isSaved = true;

            btn.innerHTML = `
            <i class="fa-solid fa-bookmark"></i>
            <span>Guardado</span>
            `;

        }

    }catch(error){
        console.error(error);
    }

}

/* ==========================
   GUARDAR / ELIMINAR
========================== */

async function toggleList(){

    const user =
    firebase.auth().currentUser;

    if(!user){
        alert(
            "Debes iniciar sesión"
        );
        return;
    }

    const btn =
    document.getElementById(
        "listBtn"
    );

    const params =
    new URLSearchParams(
        location.search
    );

    const tmdbId =
    params.get("id");

    if(!tmdbId){
        alert(
            "Contenido no encontrado"
        );
        return;
    }

    try{

        const docRef =
        firebase.firestore()
        .collection("users")
        .doc(user.uid)
        .collection("myList")
        .doc(tmdbId);

        /* ELIMINAR */
        if(isSaved){

            await docRef.delete();

            isSaved = false;

            btn.innerHTML = `
            <i class="fa-regular fa-bookmark"></i>
            <span>Mi lista</span>
            `;

            return;
        }

        /* OBTENER INFO DEL CONTENIDO */

        const heroBg =
        document
        .getElementById("heroBg")
        ?.style.backgroundImage || "";

        const backdrop =
        heroBg
        .replace('url("','')
        .replace('")','')
        .replace('url(','')
        .replace(')','');

        const poster =
        document
        .querySelector(
            "#heroLogo img"
        )?.src || "";

        const title =
        document
        .getElementById(
            "pageTitle"
        )?.innerText ||
        document.title ||
        "";

        const year =
        document
        .getElementById(
            "heroMeta"
        )?.innerText
        ?.match(/\d{4}/)?.[0]
        || "";

        const overview =
        document
        .getElementById(
            "sinopsis"
        )?.innerText || "";

        const contentUrl =
        window.location.href;

        /* GUARDAR EN FIRESTORE */

        await docRef.set({

            id: Number(tmdbId),

            url: contentUrl,

            title: title,

            poster: poster,

            backdrop: backdrop,

            year: year,

            overview: overview,

            addedAt:
            firebase.firestore
            .FieldValue
            .serverTimestamp()

        });

        isSaved = true;

        btn.innerHTML = `
        <i class="fa-solid fa-bookmark"></i>
        <span>Guardado</span>
        `;

        console.log(
            "✅ Guardado en Mi Lista"
        );

    }catch(error){

        console.error(error);

        alert(
            "Error guardando"
        );

    }

}

</script>
    <script>
      function toggleCrew() {
            const section = document.getElementById('crewSection');
            const btn = document.getElementById('crewToggleBtn');
            
            if (section.style.display === 'none') {
                section.style.display = 'block';
                btn.innerHTML = `<i class="fa-solid fa-chevron-up"></i> Ocultar equipo creativo`;
            } else {
                section.style.display = 'none';
                btn.innerHTML = `<i class="fa-solid fa-users"></i> Ver detalles del equipo creativo`;
            }
        }

       function limpiarUndefinedEnCrew() {
            const crewGrid = document.getElementById('crewGrid');
            if (!crewGrid) return;
            setTimeout(() => {
                const items = crewGrid.querySelectorAll('.crew-item, div');
                items.forEach(item => {
                    const text = item.textContent.trim();
                    if (text === 'undefined' || text === '' || text.includes('undefined')) {
                        item.style.display = 'none';
                    }
                });
            }, 800);
        }

       const TMDB_API_KEY = "38e497c6c1a043d1341416e80915669f";

        async function loadTMDBRating() {
            const urlParams = new URLSearchParams(window.location.search);
            const tmdbId = urlParams.get('id') || urlParams.get('tmdb_id');
            const mediaType = urlParams.get('type') || urlParams.get('media_type') || 'movie';

            const ratingNumber = document.getElementById('ratingNumber');
            const ratingBars = document.getElementById('ratingBars');

            if (!tmdbId) {
                ratingNumber.textContent = '—';
                return;
            }

            try {
                const response = await fetch(`https://api.themoviedb.org/3/${mediaType}/${tmdbId}?api_key=${TMDB_API_KEY}&language=es-ES`);
                if (!response.ok) throw new Error('Error en TMDB');
                const data = await response.json();
                
                const voteAverage = data.vote_average ? data.vote_average.toFixed(1) : '—';
                ratingNumber.textContent = voteAverage;

                if (data.vote_count) {
                    ratingBars.innerHTML = `
                        <div style="font-size:0.85rem; color:#aaa; margin-top:8px;">
                            Basado en <strong>${data.vote_count.toLocaleString('es-ES')}</strong> valoraciones en TMDB
                        </div>
                    `;
                }
            } catch (error) {
                console.error('Error TMDB rating:', error);
                ratingNumber.textContent = '—';
            }
        }

      async function incrementarVistas() {
            const urlParams = new URLSearchParams(window.location.search);
            const tmdbId = urlParams.get('id') || urlParams.get('tmdb_id');

            if (!tmdbId) {
                console.warn('No se encontró ID en la URL para contar vistas');
                return;
            }

          const COLLECTION_NAME = "contenidos";   // ←←←←← Cambia aquí si es "peliculas", "series", etc.

            try {
                const db = firebase.firestore();
                const docRef = db.collection(COLLECTION_NAME).doc(tmdbId.toString());

              await docRef.set({
                    vistas: firebase.firestore.FieldValue.increment(1)
                }, { merge: true });

                console.log(`✅ Vistas incrementadas correctamente (ID: ${tmdbId})`);
                
              if (typeof window.recargarStats === 'function') {
                    window.recargarStats();
                }
            } catch (error) {
                console.error('Error al incrementar vistas:', error);
            }
        }

     document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('crewToggleBtn');
            btn.addEventListener('click', toggleCrew);

          window.addEventListener('load', limpiarUndefinedEnCrew);

        loadTMDBRating();
         incrementarVistas();
        });
    </script>
</body>
