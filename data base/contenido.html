<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="pageTitle">Cargando...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS existentes + nuevo estilo de contenido -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contenido.css">
</head>
<body>
    <!-- HEADER - Tu navbar modular -->
    <header id="main-header"></header>

    <!-- LOADER -->
    <div class="loader" id="loader">
        <i class="fa-solid fa-spinner fa-spin"></i>
        <p id="loaderText">Cargando contenido desde GitHub...</p>
    </div>

    <!-- HERO -->
    <section class="hero" id="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-eyebrow" id="heroEyebrow"></div>
            <div class="hero-logo" id="heroLogo"></div>
            <div class="hero-meta" id="heroMeta"></div>
            
            <div class="hero-cta">
                <button class="btn-play" id="playBtn" onclick="togglePlay(this)">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                    <span id="playText">Reproducir</span>
                </button>
                <button class="btn-secondary" onclick="showInfo()">
                    <i class="fa-solid fa-circle-info"></i> Más info
                </button>
            </div>
            
            <div class="hero-actions">
                <button class="action-pill" id="likeBtn" onclick="toggleLike(this)">
                    <i class="fa-regular fa-thumbs-up"></i><span>Me gusta</span>
                </button>
                <button class="action-pill" id="listBtn" onclick="toggleList(this)">
                    <i class="fa-regular fa-bookmark"></i><span>Mi lista</span>
                </button>
                <button class="action-pill" onclick="shareMovie()">
                    <i class="fa-solid fa-share-nodes"></i><span>Compartir</span>
                </button>
            </div>
        </div>
    </section>

    <!-- CONTENIDO PRINCIPAL -->
    <div class="content">
        <div class="description-block">
            <p id="sinopsis">Cargando sinopsis...</p>
            <div class="genres" id="generos"></div>
        </div>
        
        <div class="stats-row" id="statsRow"></div>

        <div class="section-header">
            <h2 class="section-title">Reparto</h2>
        </div>
        <div class="cast-scroll" id="castScroll"></div>

        <div class="section-header">
            <h2 class="section-title">Equipo creativo</h2>
        </div>
        <div class="crew-grid" id="crewGrid"></div>

        <div class="section-header">
            <h2 class="section-title">Valoraciones</h2>
        </div>
        <div class="rating-block">
            <div class="rating-big">
                <div class="rating-number" id="ratingNumber">8.7</div>
            </div>
            <div class="rating-bars" id="ratingBars"></div>
        </div>

        <div class="section-header">
            <h2 class="section-title">Títulos similares</h2>
        </div>
        <div class="similar-scroll">
            <!-- Puedes hacer dinámico más adelante -->
        </div>
    </div>

    <!-- Floating Menu Container -->
    <div id="floating-container"></div>

    <!-- SCRIPTS -->
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/app/home.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/floating-menu.js"></script>
    <script src="js/app/contenido.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
