<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Cargando...</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #e50914;
      --red-dark: #b20710;
      --green: #46d369;
      --gold: #f5c518;
      --bg: #0a0a0a;
      --bg2: #141414;
      --bg3: #1f1f1f;
      --text: #ffffff;
      --text-muted: #a3a3a3;
      --text-dim: #6b6b6b;
      --radius: 10px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --nav-h: 64px;
      --bottom-nav-h: 72px;
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      font-family: 'DM Sans', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* ─── DESKTOP NAV ─── */
    .desktop-nav {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: var(--nav-h);
      z-index: 500;
      background: linear-gradient(to bottom, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0) 100%);
      transition: background var(--transition);
      padding: 0 4vw;
      align-items: center;
      justify-content: space-between;
    }
    .desktop-nav.scrolled {
      background: rgba(10,10,10,0.98);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 32px;
      color: var(--red);
      letter-spacing: 2px;
      user-select: none;
    }
    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      transition: color var(--transition);
    }
    .nav-links a:hover, .nav-links a.active { color: var(--text); }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .nav-icon-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 19px;
      cursor: pointer;
      transition: color var(--transition), transform var(--transition);
      padding: 6px;
    }
    .nav-icon-btn:hover { color: var(--text); transform: scale(1.1); }
    .profile-chip {
      width: 34px; height: 34px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--red), #ff6b6b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: transform var(--transition);
    }
    .profile-chip:hover { transform: scale(1.08); }
    /* ─── HERO ─── */
    .hero {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 580px;
      max-height: 900px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center 20%;
      transform: scale(1.04);
      transition: transform 8s ease-out;
    }
    .hero-bg.loaded { transform: scale(1); }
    .hero-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to right, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.42) 55%, rgba(0,0,0,0.08) 100%),
        linear-gradient(to top, rgba(0,0,0,0.98) 0%, rgba(0,0,0,0.5) 30%, rgba(0,0,0,0.1) 70%);
    }
    .hero-content {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 0 24px 110px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      animation: heroIn 0.8s ease both;
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* Mobile top bar */
    .mobile-topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
    }
    .back-btn {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .back-btn:hover { background: rgba(255,255,255,0.15); transform: scale(1.06); }
    .topbar-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: var(--red);
      letter-spacing: 2px;
    }
    .topbar-more {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.22);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(16px);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .topbar-more:hover { background: rgba(255,255,255,0.15); }
    /* Hero badges */
    .hero-eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .tag {
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
    }
    .tag.outline {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.8);
    }
    .tag.gold { background: var(--gold); color: #000; }
    /* Hero logo (reemplazo del título) */
    .hero-logo {
      max-width: 520px;
      width: 35%;
      margin-bottom: 12px;
    }
    .hero-logo img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 10px 40px rgba(0, 0, 0, 0.7));
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .hero-logo img:hover {
      transform: scale(1.03);
    }
    /* Meta row */
    .hero-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 14px;
    }
    .match-score {
      color: var(--green);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .meta-dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-dim); flex-shrink: 0; }
    .meta-badge {
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255,255,255,0.85);
    }
    .meta-text { color: var(--text-muted); }
    /* CTA row */
    .hero-cta {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }
    .btn-play {
      display: flex;
      align-items: center;
      gap: 11px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 700;
      padding: 14px 32px;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    }
    .btn-play:hover { background: #ddd; transform: scale(1.03); }
    .btn-play:active { transform: scale(0.98); }
    .btn-play.playing { background: var(--red); color: #fff; }
    .btn-secondary {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(255,255,255,0.14);
      backdrop-filter: blur(12px);
      color: #fff;
      border: 1.5px solid rgba(255,255,255,0.25);
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 13px 24px;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.4); }
    /* Quick Actions */
    .hero-actions {
      display: flex;
      gap: 30px;
    }
    .action-pill {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: rgba(255,255,255,0.75);
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--transition);
      background: none;
      border: none;
    }
    .action-pill:hover { color: #fff; }
    .action-pill i { font-size: 26px; }
    .action-pill.liked i { color: var(--green); }
    .action-pill.saved i { color: #fff; }
    /* ─── CONTENT SECTION ─── */
    .content {
      position: relative;
      z-index: 2;
      padding: 32px 24px 120px;
    }
    /* Description */
    .description-block {
      max-width: 720px;
      margin-bottom: 40px;
    }
    .description-block p {
      color: var(--text-muted);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .genres {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .genre-chip {
      background: var(--bg3);
      color: var(--text-muted);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
    }
    .genre-chip:hover { background: var(--bg3); border-color: rgba(255,255,255,0.3); color: #fff; }
    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 40px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-icon { font-size: 20px; color: var(--text-dim); }
    .stat-value { font-size: 20px; font-weight: 700; color: var(--text); }
    .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; }
    /* Section headers */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .section-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
    }
    .section-title::before {
      content: '';
      width: 4px;
      height: 22px;
      border-radius: 99px;
      background: var(--red);
      flex-shrink: 0;
    }
    .section-see-all {
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--transition);
      display: flex;
      align-items: center;
      gap: 5px;
      background: none;
      border: none;
    }
    .section-see-all:hover { color: var(--text); }
    /* Cast */
    .cast-scroll {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      margin-bottom: 40px;
    }
    .cast-scroll::-webkit-scrollbar { display: none; }
    .cast-card {
      min-width: 100px;
      cursor: pointer;
    }
    .cast-img-wrap {
      position: relative;
      margin-bottom: 10px;
    }
    .cast-img-wrap img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid var(--bg3);
      display: block;
      transition: border-color var(--transition), transform var(--transition);
    }
    .cast-card:hover .cast-img-wrap img {
      border-color: var(--red);
      transform: scale(1.06);
    }
    .cast-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--red);
      border: 2px solid var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
    }
    .cast-name {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
      text-align: center;
    }
    .cast-role {
      font-size: 11.5px;
      color: var(--text-dim);
      text-align: center;
      line-height: 1.3;
      margin-top: 2px;
    }
    /* Crew */
    .crew-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      margin-bottom: 40px;
    }
    .crew-card {
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: border-color var(--transition);
      cursor: pointer;
    }
    .crew-card:hover { border-color: rgba(255,255,255,0.2); }
    .crew-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--bg3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .crew-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .crew-role { font-size: 12px; color: var(--text-dim); }
    /* Similar section */
    .similar-scroll {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .similar-scroll::-webkit-scrollbar { display: none; }
    .similar-card {
      min-width: 160px;
      background: var(--bg2);
      border-radius: var(--radius);
      overflow: hidden;
      cursor: pointer;
      transition: transform var(--transition);
      border: 1px solid rgba(255,255,255,0.06);
    }
    .similar-card:hover { transform: scale(1.04); }
    .similar-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      display: block;
    }
    .similar-info {
      padding: 10px 12px;
    }
    .similar-title { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .similar-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 8px; }
    .similar-match { color: var(--green); font-weight: 600; }
    /* Rating bar */
    .rating-block {
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .rating-big {
      display: flex;
      align-items: flex-end;
      gap: 14px;
    }
    .rating-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 64px;
      line-height: 1;
      color: var(--gold);
    }
    .rating-stars {
      display: flex;
      gap: 4px;
      font-size: 20px;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .rating-bars {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rbar-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rbar-label { font-size: 12px; color: var(--text-dim); width: 16px; text-align: right; }
    .rbar-track {
      flex: 1;
      height: 4px;
      background: var(--bg3);
      border-radius: 99px;
      overflow: hidden;
    }
    .rbar-fill {
      height: 100%;
      background: var(--gold);
      border-radius: 99px;
      transition: width 1s ease;
    }
    .rbar-count { font-size: 12px; color: var(--text-dim); width: 28px; }
    /* ─── BOTTOM NAV (mobile) ─── */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--bottom-nav-h);
      background: rgba(10,10,10,0.97);
      backdrop-filter: blur(24px);
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 500;
      padding: 0 8px;
      padding-bottom: env(safe-area-inset-bottom);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-dim);
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: color var(--transition);
      padding: 8px 16px;
      border-radius: 10px;
      border: none;
      background: none;
      position: relative;
    }
    .nav-item.active { color: var(--text); }
    .nav-item i { font-size: 22px; }
    .nav-item .nav-dot {
      position: absolute;
      top: 6px;
      right: 14px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--red);
      border: 1.5px solid var(--bg);
    }
    .nav-item .nav-indicator {
      position: absolute;
      bottom: 2px;
      width: 20px;
      height: 2px;
      border-radius: 99px;
      background: var(--red);
      opacity: 0;
      transition: opacity var(--transition);
    }
    .nav-item.active .nav-indicator { opacity: 1; }
    /* ─── RESPONSIVE ─── */
    @media (max-width: 380px) {
      .hero-content { padding: 0 18px 100px; }
      .hero-cta { flex-direction: column; align-items: flex-start; }
      .btn-play, .btn-secondary { width: 100%; justify-content: center; }
      .hero-logo { max-width: 320px; }
    }
    @media (min-width: 600px) {
      .content { padding: 40px 40px 120px; }
      .hero-content { padding: 0 40px 100px; }
      .cast-img-wrap img { width: 104px; height: 104px; }
      .cast-card { min-width: 110px; }
      .hero-logo { max-width: 580px; }
    }
    @media (min-width: 900px) {
      .desktop-nav { display: flex; }
      .mobile-topbar { display: none; }
      .bottom-nav { display: none; }
      .hero { height: 88vh; min-height: 600px; max-height: 860px; }
      .hero-overlay {
        background:
          linear-gradient(to right, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.45) 60%, rgba(0,0,0,0.05) 100%),
          linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.4) 35%, rgba(0,0,0,0) 65%);
      }
      .hero-content {
        bottom: 0; left: 0;
        padding: 0 5vw 80px;
        max-width: 700px;
      }
      .content { padding: 48px 5vw 80px; max-width: 1400px; margin: 0 auto; }
      .description-block { max-width: 680px; margin-bottom: 48px; }
      .stats-row { grid-template-columns: repeat(4, 1fr); margin-bottom: 48px; }
      .hero-logo { max-width: 620px; }
    }
    @media (min-width: 1200px) {
      .hero-content { max-width: 800px; padding: 0 6vw 90px; }
      .content { padding: 56px 6vw 80px; }
      .crew-grid { grid-template-columns: repeat(3, 1fr); }
      .cast-scroll { gap: 20px; }
      .hero-logo { max-width: 680px; }
    }
    @media (min-width: 1600px) {
      .content { max-width: 1480px; }
      .hero-content { max-width: 860px; }
      .hero-logo { max-width: 720px; }
    }
    /* ─── LOADER ─── */
    .loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      color: white;
      gap: 20px;
    }
    .loader i { font-size: 3rem; }
    /* ─── ERROR ─── */
    .error-screen {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0a0a0a;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
      color: #ff6b6b;
      text-align: center;
      padding: 40px;
    }
    /* ─── TOAST ─── */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--bg2);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--radius);
      padding: 12px 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
      backdrop-filter: blur(20px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
      pointer-events: none;
      white-space: nowrap;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast i { color: var(--green); }
    @media (min-width: 900px) {
      .toast { bottom: 32px; }
    }
  </style>
</head>
<body>

  <!-- LOADER -->
  <div class="loader" id="loader">
    <i class="fa-solid fa-spinner fa-spin"></i>
    <p id="loaderText">Cargando contenido desde GitHub...</p>
  </div>

  <!-- ═══ DESKTOP NAV ═══ -->
  <nav class="desktop-nav" id="desktopNav">
    <div class="nav-brand">NETFLIX</div>
    <div class="nav-links">
      <a href="#" class="active">Inicio</a>
      <a href="#">Series</a>
      <a href="#">Películas</a>
      <a href="#">Novedades</a>
      <a href="#">Mi lista</a>
    </div>
    <div class="nav-right">
      <button class="nav-icon-btn" title="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button class="nav-icon-btn" title="Notificaciones" style="position:relative">
        <i class="fa-solid fa-bell"></i>
        <span style="position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--bg)"></span>
      </button>
      <div class="profile-chip" title="Perfil">M</div>
    </div>
  </nav>

  <!-- ═══ HERO ═══ -->
  <section class="hero" id="hero">
    <!-- Mobile top bar -->
    <div class="mobile-topbar">
      <button class="back-btn" onclick="goBack()" aria-label="Volver">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <div class="topbar-logo">NETFLIX</div>
      <button class="topbar-more" aria-label="Más opciones">
        <i class="fa-solid fa-ellipsis-vertical"></i>
      </button>
    </div>
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <!-- Eyebrow tags -->
      <div class="hero-eyebrow" id="heroEyebrow"></div>
      <!-- LOGO / TÍTULO -->
      <div class="hero-logo" id="heroLogo"></div>
      <!-- Meta -->
      <div class="hero-meta" id="heroMeta"></div>
      <!-- CTA Buttons -->
      <div class="hero-cta">
        <button class="btn-play" id="playBtn" onclick="togglePlay(this)">
          <i class="fa-solid fa-play" id="playIcon"></i>
          <span id="playText">Reproducir</span>
        </button>
        <button class="btn-secondary" onclick="showInfo()">
          <i class="fa-solid fa-circle-info"></i>
          Más info
        </button>
      </div>
      <!-- Quick actions -->
      <div class="hero-actions">
        <button class="action-pill" id="likeBtn" onclick="toggleLike(this)" aria-label="Me gusta">
          <i class="fa-regular fa-thumbs-up"></i>
          <span>Me gusta</span>
        </button>
        <button class="action-pill" id="listBtn" onclick="toggleList(this)" aria-label="Mi lista">
          <i class="fa-regular fa-bookmark"></i>
          <span>Mi lista</span>
        </button>
        <button class="action-pill" onclick="shareMovie()" aria-label="Compartir">
          <i class="fa-solid fa-share-nodes"></i>
          <span>Compartir</span>
        </button>
        <button class="action-pill" onclick="reportContent()" aria-label="Reportar">
          <i class="fa-solid fa-flag"></i>
          <span>Reportar</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ═══ CONTENT ═══ -->
  <div class="content">
    <!-- Description + Genres -->
    <div class="description-block">
      <p id="sinopsis">Cargando sinopsis...</p>
      <div class="genres" id="generos"></div>
    </div>

    <!-- Stats -->
    <div class="stats-row" id="statsRow"></div>

    <!-- Cast -->
    <div class="section-header">
      <h2 class="section-title">Reparto</h2>
      <button class="section-see-all">Ver todos <i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="cast-scroll" id="castScroll"></div>

    <!-- Crew -->
    <div class="section-header">
      <h2 class="section-title">Equipo creativo</h2>
    </div>
    <div class="crew-grid" id="crewGrid"></div>

    <!-- Rating -->
    <div class="section-header">
      <h2 class="section-title">Valoraciones</h2>
    </div>
    <div class="rating-block">
      <div class="rating-big">
        <div class="rating-number" id="ratingNumber">8.7</div>
        <div>
          <div class="rating-stars" id="ratingStars"></div>
          <div style="font-size:13px;color:var(--text-dim)" id="ratingCount">24,800 valoraciones</div>
        </div>
      </div>
      <div class="rating-bars" id="ratingBars"></div>
    </div>

    <!-- Similar titles (static por ahora) -->
    <div class="section-header">
      <h2 class="section-title">Títulos similares</h2>
      <button class="section-see-all">Explorar <i class="fa-solid fa-chevron-right"></i></button>
    </div>
    <div class="similar-scroll">
      <!-- Se pueden hacer dinámicos más adelante -->
      <div class="similar-card"><img src="https://picsum.photos/id/1015/300/200" alt=""><div class="similar-info"><div class="similar-title">Sonic 3</div><div class="similar-meta"><span class="similar-match">91%</span><span>2025</span></div></div></div>
      <div class="similar-card"><img src="https://picsum.photos/id/201/300/200" alt=""><div class="similar-info"><div class="similar-title">Spider-Verse 3</div><div class="similar-meta"><span class="similar-match">95%</span><span>2026</span></div></div></div>
    </div>
  </div>

  <!-- ═══ BOTTOM NAV (mobile) ═══ -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <button class="nav-item active" onclick="navTo('home', this)" aria-label="Inicio">
      <i class="fa-solid fa-house"></i>
      <span>Inicio</span>
      <div class="nav-indicator"></div>
    </button>
    <button class="nav-item" onclick="navTo('search', this)" aria-label="Buscar">
      <i class="fa-solid fa-magnifying-glass"></i>
      <span>Buscar</span>
      <div class="nav-indicator"></div>
    </button>
    <button class="nav-item" onclick="navTo('mylist', this)" aria-label="Mi lista">
      <i class="fa-solid fa-bookmark"></i>
      <span>Mi lista</span>
      <div class="nav-dot"></div>
      <div class="nav-indicator"></div>
    </button>
    <button class="nav-item" onclick="navTo('downloads', this)" aria-label="Descargas">
      <i class="fa-solid fa-arrow-down-to-line"></i>
      <span>Descargas</span>
      <div class="nav-indicator"></div>
    </button>
    <button class="nav-item" onclick="navTo('profile', this)" aria-label="Perfil">
      <i class="fa-solid fa-circle-user"></i>
      <span>Perfil</span>
      <div class="nav-indicator"></div>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    // ================== CONFIGURACIÓN GITHUB ==================
    const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/thexxx880/apple/main/data%20base/data/movie/";

    // ================== OBTENER ID DE LA URL ==================
    function getContentId() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        showError("❌ Falta el parámetro ID<br>Usa: <b>contenido.html?id=22</b>");
        return null;
      }
      return id;
    }

    // ================== MOSTRAR ERROR ==================
    function showError(message) {
      document.getElementById('loader').innerHTML = `
        <div class="error-screen">
          <h2 style="font-size:2rem;margin-bottom:16px;">${message}</h2>
          <p style="color:#ccc;">Verifica que la carpeta exista en tu repositorio de GitHub.</p>
        </div>`;
    }

    // ================== CARGAR JSONS ==================
    async function loadContent() {
      const id = getContentId();
      if (!id) return;

      const contenidoUrl = `${GITHUB_RAW_BASE}${id}/${id}.json`;
      const dataUrl = `${GITHUB_RAW_BASE}${id}/data.json`;

      try {
        const [contenidoRes, dataRes] = await Promise.all([
          fetch(contenidoUrl),
          fetch(dataUrl)
        ]);

        if (!contenidoRes.ok) throw new Error("El archivo " + id + ".json no existe");

        const contenido = await contenidoRes.json();
        let vistasData = { vistas: {} };
        if (dataRes.ok) vistasData = await dataRes.json();

        renderPage(contenido, vistasData, id);
      } catch (err) {
        console.error(err);
        showError("No se encontró el contenido<br>ID: " + id);
      }
    }

    // ================== RENDERIZAR TODO ==================
    function renderPage(data, vistasData, id) {
      // Título de la pestaña
      document.getElementById('pageTitle').textContent = `${data.titulo} • Netflix`;

      // Hero Background
      const heroBg = document.getElementById('heroBg');
      heroBg.style.backgroundImage = `url('${data.backdrop || data.poster}')`;
      setTimeout(() => heroBg.classList.add('loaded'), 100);

      // Hero Logo
      const heroLogo = document.getElementById('heroLogo');
      if (data.logo && data.logo !== "") {
        heroLogo.innerHTML = `<img src="${data.logo}" alt="${data.titulo}">`;
      } else {
        heroLogo.innerHTML = `<h1 style="font-size:3.8rem;line-height:1;color:white;font-family:'Bebas Neue',sans-serif;">${data.titulo}</h1>`;
      }

      // Trending / Eyebrow
      const eyebrow = document.getElementById('heroEyebrow');
      if (data.trending) {
        eyebrow.innerHTML = `<span class="tag"><i class="fa-solid fa-fire-flame-curved"></i> Tendencia #1</span>`;
      } else {
        eyebrow.innerHTML = `<span class="tag outline">${data.generos[0] || 'Película'}</span>`;
      }

      // Meta information
      document.getElementById('heroMeta').innerHTML = `
        <span class="match-score"><i class="fa-solid fa-thumbs-up"></i> ${Math.round(data.puntuacion * 10)}% para ti</span>
        <div class="meta-dot"></div>
        <span class="meta-text">${data.año}</span>
        <div class="meta-dot"></div>
        <span class="meta-text">${data.duracion}</span>
        <div class="meta-dot"></div>
        <span class="meta-badge">${data.calificacion}</span>
        <span class="meta-badge">${data.edad_minima}+</span>
      `;

      // Sinopsis
      document.getElementById('sinopsis').textContent = data.sinopsis || "Sin sinopsis disponible.";

      // Géneros
      const generosContainer = document.getElementById('generos');
      generosContainer.innerHTML = data.generos.map(g => 
        `<span class="genre-chip">${g}</span>`
      ).join('');

      // Stats Row
      const vistas = vistasData.vistas[id] || 0;
      document.getElementById('statsRow').innerHTML = `
        <div class="stat-card">
          <i class="fa-solid fa-calendar-days stat-icon"></i>
          <div class="stat-value">${data.año}</div>
          <div class="stat-label">Estreno</div>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-clock stat-icon"></i>
          <div class="stat-value">${data.duracion}</div>
          <div class="stat-label">Duración</div>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-star stat-icon" style="color:var(--gold)"></i>
          <div class="stat-value" style="color:var(--gold)">${data.puntuacion}</div>
          <div class="stat-label">Puntuación TMDB</div>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-eye stat-icon"></i>
          <div class="stat-value">${vistas.toLocaleString('es-ES')}</div>
          <div class="stat-label">Vistas</div>
        </div>
      `;

      // Reparto
      const castContainer = document.getElementById('castScroll');
      castContainer.innerHTML = data.reparto.map(actor => `
        <div class="cast-card" onclick="showCastInfo('${actor.nombre}')">
          <div class="cast-img-wrap">
            <img src="${actor.foto || 'https://i.pravatar.cc/150?img=12'}" alt="${actor.nombre}">
          </div>
          <div class="cast-name">${actor.nombre}</div>
          <div class="cast-role">${actor.personaje}</div>
        </div>
      `).join('');

      // Equipo creativo + crew
      const crewContainer = document.getElementById('crewGrid');
      const allCrew = [...(data.equipo_creativo || []), ...(data.crew || []).slice(0, 6)];
      crewContainer.innerHTML = allCrew.map(person => `
        <div class="crew-card">
          <div class="crew-icon"><i class="fa-solid fa-user-tie"></i></div>
          <div>
            <div class="crew-name">${person.nombre}</div>
            <div class="crew-role">${person.rol}</div>
          </div>
        </div>
      `).join('');

      // Ocultar loader
      document.getElementById('loader').style.display = 'none';

      console.log('%c✅ Contenido cargado correctamente desde GitHub', 'color:#46d369;font-weight:bold');
    }

    // ================== FUNCIONES INTERACTIVAS (originales) ==================
    let isPlaying = false;
    function togglePlay(btn) {
      isPlaying = !isPlaying;
      const icon = document.getElementById('playIcon');
      const text = document.getElementById('playText');
      if (isPlaying) {
        icon.className = 'fa-solid fa-pause';
        text.textContent = 'Pausar';
        btn.classList.add('playing');
        showToast('Reproduciendo...', 'fa-play');
      } else {
        icon.className = 'fa-solid fa-play';
        text.textContent = 'Reproducir';
        btn.classList.remove('playing');
        showToast('Pausado', 'fa-pause');
      }
    }

    let liked = false;
    function toggleLike(btn) {
      liked = !liked;
      const icon = btn.querySelector('i');
      if (liked) {
        icon.className = 'fa-solid fa-thumbs-up';
        btn.classList.add('liked');
        btn.querySelector('span').textContent = 'Te gustó';
        showToast('¡Te gusta!', 'fa-heart');
      } else {
        icon.className = 'fa-regular fa-thumbs-up';
        btn.classList.remove('liked');
        btn.querySelector('span').textContent = 'Me gusta';
      }
    }

    let saved = false;
    function toggleList(btn) {
      saved = !saved;
      const icon = btn.querySelector('i');
      if (saved) {
        icon.className = 'fa-solid fa-bookmark';
        btn.classList.add('saved');
        btn.querySelector('span').textContent = 'Guardado';
        showToast('Añadido a Mi lista', 'fa-bookmark');
      } else {
        icon.className = 'fa-regular fa-bookmark';
        btn.classList.remove('saved');
        btn.querySelector('span').textContent = 'Mi lista';
      }
    }

    function shareMovie() {
      showToast('Enlace copiado al portapapeles', 'fa-link');
    }

    function reportContent() {
      showToast('Reporte enviado. ¡Gracias!', 'fa-flag');
    }

    function showInfo() {
      showToast('Más información cargada', 'fa-circle-info');
    }

    function showCastInfo(name) {
      showToast(`Filmografía de ${name}`, 'fa-person');
    }

    function goBack() {
      window.history.back();
    }

    function navTo(section, el) {
      document.querySelectorAll('.bottom-nav .nav-item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      showToast(section === 'home' ? 'Inicio' : section, 'fa-circle-check');
    }

    // ================== TOAST ==================
    let toastTimer;
    function showToast(msg, icon = 'fa-circle-check') {
      const t = document.getElementById('toast');
      t.innerHTML = `<i class="fa-solid ${icon}"></i> ${msg}`;
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ================== INICIO ==================
    window.onload = loadContent;
  </script>
</body>
</html>
