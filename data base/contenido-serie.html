<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="pageTitle">Cargando serie...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/contenido.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase/applelz.js"></script>
    
    <style>
        /* Estilos adicionales para Series */
        .seasons-tabs {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 10px;
            scrollbar-width: none;
        }
        .seasons-tabs::-webkit-scrollbar { display: none; }
        
        .season-tab {
            background: #1f1f1f;
            color: #fff;
            border: 2px solid #333;
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }
        .season-tab.active {
            background: #e50914;
            border-color: #e50914;
            box-shadow: 0 0 15px rgba(229, 9, 20, 0.5);
        }
        .season-tab:hover:not(.active) {
            background: #333;
            border-color: #555;
        }

        .episodes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .episode-card {
            background: #181818;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: 1px solid #2a2a2a;
        }
        .episode-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
        }

        .episode-thumbnail {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-size: cover;
            background-position: center;
        }
        .episode-thumbnail::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.85));
        }
        .episode-number {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 0.85rem;
            padding: 4px 10px;
            border-radius: 20px;
            font-weight: 700;
        }
        .episode-duration {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .episode-info {
            padding: 16px;
        }
        .episode-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 6px;
            line-height: 1.3;
        }
        .episode-sinopsis {
            font-size: 0.9rem;
            color: #aaa;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .episode-play-btn {
            margin-top: 12px;
            width: 100%;
            background: #e50914;
            color: white;
            border: none;
            padding: 11px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .episode-play-btn:hover {
            background: #f40612;
        }
    </style>
</head>
<body>
    <!-- HEADER -->
    <header id="main-header"></header>
   
    <!-- HERO -->
    <section class="hero" id="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-eyebrow" id="heroEyebrow"></div>
            <div class="hero-logo" id="heroLogo"></div>
            <div class="hero-meta" id="heroMeta"></div>
          
            <div class="hero-cta">
                <button class="btn-play" id="playBtn">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                    <span id="playText">Reproducir</span>
                </button>
                <button class="btn-secondary" id="trailerBtn">
                    <i class="fa-solid fa-film"></i> Trailer
                </button>
            </div>
          
            <div class="hero-actions">
                <button class="action-pill" id="likeBtn"><i class="fa-regular fa-thumbs-up"></i><span>Me gusta</span></button>
                <button class="action-pill" id="listBtn">
                    <i class="fa-regular fa-bookmark"></i>
                    <span>Mi lista</span>
                </button>
            </div>
        </div>
    </section>

    <div class="content">
        <div class="description-block">
            <p id="sinopsis">Cargando sinopsis...</p>
            <div class="genres" id="generos"></div>
        </div>
        <div class="stats-row" id="statsRow"></div>

        <!-- REPARTO -->
        <div class="section-header"><h2 class="section-title">Reparto</h2></div>
        <div class="cast-scroll" id="castScroll"></div>

        <!-- EQUIPO CREATIVO -->
        <button id="crewToggleBtn" class="btn-secondary" style="margin: 30px 0 15px; width: 100%; max-width: 320px; display: block; margin-left: auto; margin-right: auto;">
            <i class="fa-solid fa-users"></i> Ver detalles del equipo creativo
        </button>
        <div id="crewSection" style="display: none;">
            <div class="section-header"><h2 class="section-title">Equipo creativo</h2></div>
            <div class="crew-grid" id="crewGrid"></div>
        </div>

        <!-- VALORACIONES TMDB -->
        <div class="section-header"><h2 class="section-title">Valoraciones</h2></div>
        <div class="rating-block">
            <div class="rating-big">
                <div class="rating-number" id="ratingNumber">—</div>
                <small id="ratingSource" style="display:block; font-size:0.8rem; color:#aaa; margin-top:4px;">TMDB</small>
            </div>
            <div class="rating-bars" id="ratingBars"></div>
        </div>

        <!-- TEMPORADAS Y EPISODIOS -->
        <div class="section-header" style="margin-top: 40px;">
            <h2 class="section-title">Temporadas</h2>
        </div>
        <div id="seasonsTabs" class="seasons-tabs"></div>

        <div class="section-header" style="margin-top: 30px;">
            <h2 class="section-title" id="currentSeasonTitle">Temporada 1</h2>
        </div>
        <div id="episodesList" class="episodes-grid"></div>
    </div>

    <!-- FLOATING MENU -->
    <div id="floating-container"></div>

    <!-- MODAL REPRODUCTORES -->
    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Elige tu reproductor</h3>
                <span class="close-modal" onclick="closeModal()">✕</span>
            </div>
            <div class="modal-body">
                <div class="player-option" onclick="openPlayer(1)">
                    <i class="fa-solid fa-play-circle"></i>
                    <div>
                        <strong>Reproductor 1 (LzPro)</strong>
                        <p>Rápido y ligero</p>
                    </div>
                </div>
                <div class="player-option" onclick="openPlayer(2)">
                    <i class="fa-solid fa-play-circle"></i>
                    <div>
                        <strong>Reproductor 2 (Premium)</strong>
                        <p>Calidad superior</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/core/tmdb.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/app/home.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/floating-menu.js"></script>
    <script src="js/main.js"></script>

    <!-- ============================================ -->
    <!--          LÓGICA COMPLETA PARA SERIES         -->
    <!-- ============================================ -->
    <script>
        // ================== CONFIGURACIÓN ==================
        const GITHUB_RAW_BASE = "https://raw.githubusercontent.com/thexxx880/apple/main/data%20base/data/serie/";
        
        let currentSeriesId = null;
        let currentSeriesData = null;
        let currentSeason = 1;
        let currentEpisodeData = null; // Para el reproductor

        // ================== OBTENER ID ==================
        function getContentId() {
            const params = new URLSearchParams(window.location.search);
            return params.get("id") || params.get("tmdb_id");
        }

        // ================== CARGAR SERIE PRINCIPAL ==================
        async function loadSeries() {
            const id = getContentId();
            if (!id) {
                showError("❌ Falta el parámetro <b>id</b> en la URL");
                return;
            }
            currentSeriesId = id;

            const url = `${GITHUB_RAW_BASE}${id}/${id}.json`;
            console.log("Cargando serie desde:", url);

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error(`No se encontró ${id}.json`);

                const data = await res.json();
                currentSeriesData = data;

                renderSeriesPage(data);
                renderSeasonsTabs(data);

                // Cargar temporada 1 por defecto
                setTimeout(() => {
                    loadSeasonEpisodes(id, 1);
                }, 300);

                // Incrementar vistas
                setTimeout(incrementarVistas, 800);

            } catch (err) {
                console.error(err);
                showError(`No se encontró la serie<br><small>ID: ${id}</small>`);
            }
        }

        // ================== RENDERIZAR PÁGINA DE SERIE ==================
        function renderSeriesPage(data) {
            // Título
            document.getElementById('pageTitle').textContent = `${data.titulo} • LzPlay`;

            // Hero Background
            const heroBg = document.getElementById('heroBg');
            heroBg.style.backgroundImage = `url('${data.backdrop || data.poster}')`;
            setTimeout(() => heroBg.classList.add('loaded'), 100);

            // Logo o título
            const heroLogo = document.getElementById('heroLogo');
            heroLogo.innerHTML = data.logo 
                ? `<img src="${data.logo}" alt="${data.titulo}">`
                : `<h1 style="font-size:3.8rem;line-height:1;color:white;font-family:'Bebas Neue',sans-serif;">${data.titulo}</h1>`;

            // Meta info
            const temporadas = data.number_of_seasons || 1;
            const episodiosTotales = data.number_of_episodes || 0;

            document.getElementById('heroMeta').innerHTML = `
                <span class="match-score"><i class="fa-solid fa-thumbs-up"></i> ${Math.round((data.puntuacion || 0) * 10)}% para ti</span>
                <div class="meta-dot"></div>
                <span class="meta-text">${data.año || '2025'}</span>
                <div class="meta-dot"></div>
                <span class="meta-text">${temporadas} Temporada${temporadas > 1 ? 's' : ''}</span>
                <div class="meta-dot"></div>
                <span class="meta-text">${episodiosTotales} Episodios</span>
                <div class="meta-dot"></div>
                <span class="meta-badge">${data.calificacion || 'TV-14'}</span>
                <span class="meta-badge">${data.edad_minima || '13'}+</span>
            `;

            // Sinopsis
            document.getElementById('sinopsis').textContent = data.sinopsis || "Sin sinopsis disponible.";

            // Géneros
            const generosContainer = document.getElementById('generos');
            generosContainer.innerHTML = (data.generos || []).map(g => 
                `<span class="genre-chip">${g}</span>`
            ).join('');

            // Stats
            document.getElementById('statsRow').innerHTML = `
                <div class="stat-card">
                    <i class="fa-solid fa-calendar-days stat-icon"></i>
                    <div class="stat-value">${data.año || '—'}</div>
                    <div class="stat-label">Estreno</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-tv stat-icon"></i>
                    <div class="stat-value">${temporadas}</div>
                    <div class="stat-label">Temporadas</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-list-ol stat-icon"></i>
                    <div class="stat-value">${episodiosTotales}</div>
                    <div class="stat-label">Episodios</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-star stat-icon" style="color:var(--gold)"></i>
                    <div class="stat-value" style="color:var(--gold)">${data.puntuacion || '—'}</div>
                    <div class="stat-label">Puntuación</div>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-eye stat-icon"></i>
                    <div class="stat-value" id="viewCount">—</div>
                    <div class="stat-label">Vistas</div>
                </div>
            `;

            // Reparto
            const castContainer = document.getElementById('castScroll');
            castContainer.innerHTML = (data.reparto || []).map(actor => `
                <div class="cast-card" onclick="showCastInfo('${actor.nombre}')">
                    <div class="cast-img-wrap"><img src="${actor.foto || 'https://i.pravatar.cc/150?img=12'}" alt="${actor.nombre}"></div>
                    <div class="cast-name">${actor.nombre}</div>
                    <div class="cast-role">${actor.personaje}</div>
                </div>
            `).join('');

            // Equipo creativo
            const crewContainer = document.getElementById('crewGrid');
            const allCrew = [...(data.equipo_creativo || []), ...(data.crew || [])];
            crewContainer.innerHTML = allCrew.map(person => `
                <div class="crew-card">
                    <div class="crew-icon"><i class="fa-solid fa-user-tie"></i></div>
                    <div>
                        <div class="crew-name">${person.nombre}</div>
                        <div class="crew-role">${person.rol}</div>
                    </div>
                </div>
            `).join('');

            // Botón principal de reproducir (primera temporada)
            const playBtn = document.getElementById('playBtn');
            if (playBtn) {
                playBtn.onclick = () => {
                    // Reproduce el primer episodio de la temporada 1
                    loadSeasonEpisodes(currentSeriesId, 1).then(() => {
                        // Esperar a que se carguen los episodios y reproducir el primero
                        setTimeout(() => {
                            const firstEpisodeBtn = document.querySelector('.episode-play-btn');
                            if (firstEpisodeBtn) firstEpisodeBtn.click();
                        }, 600);
                    });
                };
            }

            // Trailer
            const trailerBtn = document.getElementById('trailerBtn');
            if (trailerBtn) {
                trailerBtn.onclick = () => playTrailer(data);
            }

            // Cargar estado de Mi Lista
            loadFavoriteState(currentSeriesId);

            // Ocultar loader si existe
            const loader = document.getElementById('loader');
            if (loader) loader.style.display = 'none';

            console.log(`✅ Serie cargada: ${data.titulo}`);
        }

        // ================== RENDERIZAR PESTAÑAS DE TEMPORADAS ==================
        function renderSeasonsTabs(data) {
            const container = document.getElementById('seasonsTabs');
            container.innerHTML = '';

            const numberOfSeasons = data.number_of_seasons || 1;

            for (let i = 1; i <= numberOfSeasons; i++) {
                const tab = document.createElement('div');
                tab.className = `season-tab ${i === 1 ? 'active' : ''}`;
                tab.innerHTML = `T${i}`;
                
                tab.onclick = () => {
                    // Quitar active de todas
                    document.querySelectorAll('.season-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    
                    // Cargar episodios de esta temporada
                    loadSeasonEpisodes(currentSeriesId, i);
                };
                
                container.appendChild(tab);
            }
        }

        // ================== CARGAR EPISODIOS DE UNA TEMPORADA ==================
        async function loadSeasonEpisodes(seriesId, seasonNumber) {
            currentSeason = seasonNumber;
            const url = `${GITHUB_RAW_BASE}${seriesId}/t${seasonNumber}/${seriesId}.json`;
            
            console.log("Cargando episodios:", url);
            
            const titleEl = document.getElementById('currentSeasonTitle');
            titleEl.textContent = `Temporada ${seasonNumber}`;

            const container = document.getElementById('episodesList');
            container.innerHTML = `<div style="padding:20px; text-align:center; color:#666;">Cargando episodios...</div>`;

            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("No se encontraron episodios");

                const seasonData = await res.json();
                const episodes = seasonData.episodes || [];

                renderEpisodes(episodes, seasonNumber);

            } catch (error) {
                console.error("Error cargando episodios:", error);
                container.innerHTML = `
                    <div style="padding:40px; text-align:center; color:#ff6b6b;">
                        <i class="fa-solid fa-exclamation-triangle" style="font-size:2rem; margin-bottom:10px;"></i><br>
                        No se pudieron cargar los episodios de la Temporada ${seasonNumber}
                    </div>
                `;
            }
        }

        // ================== RENDERIZAR LISTA DE EPISODIOS ==================
        function renderEpisodes(episodes, seasonNumber) {
            const container = document.getElementById('episodesList');
            container.innerHTML = '';

            if (!episodes.length) {
                container.innerHTML = `<p style="color:#888; padding:20px;">No hay episodios disponibles en esta temporada.</p>`;
                return;
            }

            episodes.forEach(ep => {
                const card = document.createElement('div');
                card.className = 'episode-card';
                
                card.innerHTML = `
                    <div class="episode-thumbnail" style="background-image: url('${ep.thumbnail || currentSeriesData?.backdrop || 'https://picsum.photos/id/1015/600/340'}')">
                        <div class="episode-number">E${ep.episode_number}</div>
                        <div class="episode-duration">${ep.duracion || '45 min'}</div>
                    </div>
                    <div class="episode-info">
                        <div class="episode-title">${ep.titulo || `Episodio ${ep.episode_number}`}</div>
                        <div class="episode-sinopsis">${ep.sinopsis || 'Sin descripción disponible.'}</div>
                        
                        <button class="episode-play-btn" data-video="${ep.video_url || ''}">
                            <i class="fa-solid fa-play"></i> 
                            <span>Reproducir episodio</span>
                        </button>
                    </div>
                `;

                // Evento de reproducción
                const playBtn = card.querySelector('.episode-play-btn');
                playBtn.onclick = () => {
                    if (!ep.video_url) {
                        alert("Este episodio aún no tiene video disponible.");
                        return;
                    }
                    
                    currentEpisodeData = {
                        video: ep.video_url,
                        poster: ep.thumbnail || currentSeriesData.backdrop,
                        title: encodeURIComponent(`${currentSeriesData.titulo} - T${seasonNumber}E${ep.episode_number}`)
                    };
                    
                    // Abrir modal de reproductores
                    const modal = document.getElementById('playerModal');
                    modal.style.display = 'flex';
                };

                container.appendChild(card);
            });
        }

        // ================== ABRIR REPRODUCTOR CON EPISODIO ESPECÍFICO ==================
        function openPlayer(option) {
            const modal = document.getElementById('playerModal');
            modal.style.display = 'none';

            if (!currentEpisodeData || !currentEpisodeData.video) {
                alert("No hay video disponible para este episodio.");
                return;
            }

            let url = '';
            if (option === 1) {
                url = `https://lzplayhd.online/lzpro/player.html?video=${encodeURIComponent(currentEpisodeData.video)}&poster=${encodeURIComponent(currentEpisodeData.poster)}&title=${currentEpisodeData.title}`;
            } else if (option === 2) {
                url = `https://lzrdrz10.github.io/premiumplayer/player.html?video=${encodeURIComponent(currentEpisodeData.video)}&poster=${encodeURIComponent(currentEpisodeData.poster)}&title=${currentEpisodeData.title}`;
            }

            window.open(url, '_blank');
        }

        // ================== INCREMENTAR VISTAS ==================
        async function incrementarVistas() {
            const id = currentSeriesId;
            if (!id) return;

            try {
                const db = firebase.firestore();
                await db.collection("contenidos").doc(id).set({
                    vistas: firebase.firestore.FieldValue.increment(1),
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                setTimeout(() => {
                    if (typeof window.recargarStats === "function") window.recargarStats();
                }, 400);
            } catch (e) {
                console.error("Error incrementando vistas:", e);
            }
        }

        window.recargarStats = async function () {
            const id = currentSeriesId;
            if (!id) return;

            try {
                const doc = await firebase.firestore().collection("contenidos").doc(id).get();
                const el = document.getElementById("viewCount");
                if (el && doc.exists) {
                    el.textContent = (doc.data().vistas || 0).toLocaleString("es-ES");
                }
            } catch (e) {}
        };

        // ================== TRAILER ==================
        function playTrailer(data) {
            const trailerUrl = data.trailer || data.youtube;
            if (trailerUrl) {
                window.open(trailerUrl, '_blank');
            } else {
                alert("No hay trailer disponible para esta serie.");
            }
        }

        // ================== FUNCIONES DE MI LISTA (Firebase) ==================
        let isSaved = false;

        async function verificarMiLista() {
            const user = firebase.auth().currentUser;
            if (!user || !currentSeriesId) return;

            try {
                const doc = await firebase.firestore()
                    .collection("users")
                    .doc(user.uid)
                    .collection("myList")
                    .doc(currentSeriesId)
                    .get();

                const btn = document.getElementById("listBtn");
                if (!btn) return;

                if (doc.exists) {
                    isSaved = true;
                    btn.innerHTML = `<i class="fa-solid fa-bookmark"></i><span>Guardado</span>`;
                } else {
                    isSaved = false;
                    btn.innerHTML = `<i class="fa-regular fa-bookmark"></i><span>Mi lista</span>`;
                }
            } catch (e) {
                console.error("Error verificando Mi Lista:", e);
            }
        }

        async function toggleList() {
            const user = firebase.auth().currentUser;
            if (!user) {
                window.location.href = "https://lzplayhd.online/apple/login.html";
                return;
            }

            const btn = document.getElementById("listBtn");
            if (!btn || !currentSeriesId) return;

            const docRef = firebase.firestore()
                .collection("users")
                .doc(user.uid)
                .collection("myList")
                .doc(currentSeriesId);

            try {
                if (isSaved) {
                    await docRef.delete();
                    isSaved = false;
                    btn.innerHTML = `<i class="fa-regular fa-bookmark"></i><span>Mi lista</span>`;
                } else {
                    await docRef.set({
                        id: Number(currentSeriesId),
                        type: "tv",
                        url: window.location.href,
                        addedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    isSaved = true;
                    btn.innerHTML = `<i class="fa-solid fa-bookmark"></i><span>Guardado</span>`;
                }
            } catch (error) {
                console.error("Error en Mi Lista:", error);
                alert("Error al guardar en Mi Lista");
            }
        }

        async function loadFavoriteState(movieId) {
            // Esta función es compatible con el sistema original
            const btn = document.getElementById('listBtn');
            if (!btn) return;

            const user = firebase.auth().currentUser;
            if (!user) return;

            try {
                const docSnap = await firebase.firestore().collection("users").doc(user.uid).get();
                const favorites = docSnap.exists && docSnap.data().favorites ? docSnap.data().favorites : {};
                const isFav = !!favorites[movieId];

                if (isFav) {
                    btn.innerHTML = `<i class="fa-solid fa-bookmark"></i><span>Guardado</span>`;
                    btn.style.color = '#f5c518';
                } else {
                    btn.innerHTML = `<i class="fa-regular fa-bookmark"></i><span>Mi lista</span>`;
                    btn.style.color = '';
                }
            } catch (e) {}
        }

        // ================== FUNCIONES AUXILIARES ==================
        function showCastInfo(name) {
            alert(`Filmografía de ${name} (próximamente)`);
        }

        function closeModal() {
            document.getElementById('playerModal').style.display = 'none';
        }

        function showError(message) {
            const content = document.querySelector('.content');
            if (content) {
                content.innerHTML = `
                    <div style="text-align:center; padding:60px 20px; color:white;">
                        <h2 style="font-size:2rem; margin-bottom:16px;">${message}</h2>
                        <button onclick="location.reload()" style="margin-top:20px; padding:12px 30px; background:#e50914; color:white; border:none; border-radius:8px; font-size:1rem;">
                            Recargar página
                        </button>
                    </div>
                `;
            }
        }

        // ================== INICIALIZACIÓN ==================
        document.addEventListener("DOMContentLoaded", () => {
            // Cargar serie
            loadSeries();

            // Configurar Mi Lista
            firebase.auth().onAuthStateChanged(async (user) => {
                if (!user) return;
                await verificarMiLista();
                const listBtn = document.getElementById("listBtn");
                if (listBtn) listBtn.addEventListener("click", toggleList);
            });

            // Toggle equipo creativo
            const crewBtn = document.getElementById('crewToggleBtn');
            if (crewBtn) {
                crewBtn.addEventListener('click', () => {
                    const section = document.getElementById('crewSection');
                    if (section.style.display === 'none' || section.style.display === '') {
                        section.style.display = 'block';
                        crewBtn.innerHTML = `<i class="fa-solid fa-chevron-up"></i> Ocultar equipo creativo`;
                    } else {
                        section.style.display = 'none';
                        crewBtn.innerHTML = `<i class="fa-solid fa-users"></i> Ver detalles del equipo creativo`;
                    }
                });
            }

            // Cargar rating TMDB
            setTimeout(() => {
                if (typeof loadTMDBRating === 'function') loadTMDBRating();
            }, 1200);
        });

        // Función para rating TMDB (reutilizada)
        async function loadTMDBRating() {
            const id = getContentId();
            if (!id) return;

            try {
                const data = await fetchTMDB(`tv/${id}`);
                if (!data) return;

                const ratingEl = document.getElementById('ratingNumber');
                if (ratingEl) ratingEl.textContent = data.vote_average ? data.vote_average.toFixed(1) : '—';

                const bars = document.getElementById('ratingBars');
                if (bars && data.vote_count) {
                    bars.innerHTML = `
                        <div style="font-size:0.85rem; color:#aaa; margin-top:8px;">
                            Basado en <strong>${data.vote_count.toLocaleString('es-ES')}</strong> valoraciones en TMDB
                        </div>
                    `;
                }
            } catch (e) {
                console.error("Error TMDB rating:", e);
            }
        }
    </script>
</body>
</html>
