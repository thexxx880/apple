<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title id="pageTitle">Cargando serie...</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/load.css">
    <link rel="stylesheet" href="css/contenido-serie.css">

    <script src="js/components/load.js"></script>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase/applelz.js"></script>
</head>
<body>
    <div id="loader">
        <div class="loader-glow"></div>
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi3dK3-XAKrEia-lWmiUqAYRfFQ1lR9eJX6ZZH8e_vHf576qf9GJjIWBW9Jg5LsilXX7WO2MOEkg5gzc4pESziaPeMJ9ws9mwtCDdp3p_17D0e0Uop_ZxavwwJeNLBvoyZJ0cxTKQpjzrJIR6LjJslB24tj-77AYrRCacQ3F2S2VPoXpPzPhM1zndxyd1Rg/s3307/B64D5386-DCA4-410B-A0A6-6ACB19D0A06F.png" alt="LzPlay" class="loader-logo">
        <div class="loader-bar"><span></span></div>
    </div>

    <header id="main-header"></header>
    
    <section class="hero" id="hero">
        <div class="hero-bg" id="heroBg"></div>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <div class="hero-eyebrow" id="heroEyebrow"></div>
            <div class="hero-logo" id="heroLogo"></div>
            <div class="hero-meta" id="heroMeta"></div>
          
            <div class="hero-cta">
                <button class="btn-play" id="playBtn">
                    <i class="fa-solid fa-play" id="playIcon"></i>
                    <span id="playText">Reproducir T1 E1</span>
                </button>
                <button class="btn-secondary" id="trailerBtn">
                    <i class="fa-solid fa-film"></i> Trailer
                </button>
            </div>
          
            <div class="hero-actions">
                <button class="action-pill" id="likeBtn"><i class="fa-regular fa-thumbs-up"></i><span>Me gusta</span></button>
                <button class="action-pill" id="listBtn">
                    <i class="fa-regular fa-bookmark"></i><span>Mi lista</span>
                </button>
            </div>
        </div>
    </section>

    <div class="content">
        <div class="section-header" style="margin-top: 0;">
            <h2 class="section-title">Temporadas</h2>
        </div>
        <div id="seasonsTabs" class="seasons-tabs"></div>

        <div class="section-header" style="justify-content: space-between;">
            <h2 class="section-title" id="currentSeasonTitle">Temporada 1</h2>
            <div class="slider-nav">
                <button onclick="scrollSlider(-1)"><i class="fa-solid fa-chevron-left"></i></button>
                <button onclick="scrollSlider(1)"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
        <div id="episodesList" class="episodes-slider"></div>

        <div class="description-block" style="margin-top: 40px;">
            <p id="sinopsis">Cargando sinopsis...</p>
            <div class="genres" id="generos"></div>
        </div>
        <div class="stats-row" id="statsRow"></div>

        <div class="section-header"><h2 class="section-title">Reparto</h2></div>
        <div class="cast-scroll" id="castScroll"></div>

        <button id="crewToggleBtn" class="btn-secondary" style="margin: 30px 0 15px; width: 100%; max-width: 320px; display: block; margin-left: auto; margin-right: auto;">
            <i class="fa-solid fa-users"></i> Ver detalles del equipo creativo
        </button>
        <div id="crewSection" style="display: none;">
            <div class="section-header"><h2 class="section-title">Equipo creativo</h2></div>
            <div class="crew-grid" id="crewGrid"></div>
        </div>

        <div class="section-header"><h2 class="section-title">Valoraciones</h2></div>
        <div class="rating-block">
            <div class="rating-number" id="ratingNumber">—</div>
            <div id="ratingBars"></div>
        </div>
    </div>

    <div id="floating-container"></div>

    <div id="playerModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Elige tu reproductor</h3>
                <span class="close-modal" onclick="closeModal()">✕</span>
            </div>
            <div class="modal-body">
                <div class="player-option" onclick="openPlayer(1)">
                    <i class="fa-solid fa-play-circle"></i>
                    <div>
                        <strong style="font-size:1.1rem; display:block; color:white;">LzPro</strong>
                        <span style="color:var(--text-muted); font-size:0.9rem;">Servidor principal (Rápido)</span>
                    </div>
                </div>
                <div class="player-option" onclick="openPlayer(2)">
                    <i class="fa-solid fa-play-circle"></i>
                    <div>
                        <strong style="font-size:1.1rem; display:block; color:white;">Premium</strong>
                        <span style="color:var(--text-muted); font-size:0.9rem;">Servidor secundario (HD)</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/core/tmdb.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/app/home.js"></script>
    <script src="js/components/navbar.js"></script>
    <script src="js/components/floating-menu.js"></script>
    <script src="js/main.js"></script>
    
    <script src="js/app/contenido-serie.js"></script>
</body>
</html>
