<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>LzPlay</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
   <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDb1vEGCkNpcarttuwLLvuB40g8reRFTGM",
  authDomain: "applelz-b5883.firebaseapp.com",
  projectId: "applelz-b5883",
  storageBucket: "applelz-b5883.firebasestorage.app",
  messagingSenderId: "489468218632",
  appId: "1:489468218632:web:598a550f7ebe7c6de7b0bd",
  measurementId: "G-J085DHR8M3"
};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

async function guardar() {

  try {

    await addDoc(collection(db, "usuarios"), {
      nombre: "Chepo",
      nivel: 99,
      online: true,
      fecha: new Date()
    });

    console.log("✅ Datos guardados");

    document.body.innerHTML += `
      <h1 style="color:lime;text-align:center;">
        Datos guardados en Firebase ✅
      </h1>
    `;

  } catch(error) {

    console.error(error);

  }

}

guardar();

</script>
</head>
<body>

    <!-- HEADER -->
    <header id="main-header"></header>

    <!-- HERO -->
    <section class="hero" id="hero">
        <div class="hero-content">

            <div class="badges">
                <div class="badge" id="hero-type">PELÍCULA</div>
                <div class="badge rating" id="hero-rating">⭐ --</div>
                <div class="badge rating" id="hero-year">----</div>
            </div>

            <img id="hero-logo" class="hero-logo" alt="Logo de la película">

            <p id="hero-description"></p>

            <a href="#" class="play-btn" id="hero-play-btn">
                <i class="fas fa-play"></i>
                Ver ahora
            </a>

        </div>
    </section>

    <!-- PELÍCULAS MÁS VISTAS -->
    <section class="section">

        <div class="section-header">
            <h2 class="section-title">Películas más vistas</h2>
            <span class="view-all">Ver todo</span>
        </div>

        <div class="movies-grid" id="movies-grid"></div>

    </section>

    <!-- CONTENEDOR DEL MENÚ FLOTANTE -->
    <div id="floating-container"></div>

    <!-- SCRIPTS -->
    <script src="js/core/utils.js"></script>
    <script src="js/core/api.js"></script>
    <script src="js/app/home.js"></script>
    <script src="js/components/navbar.js"></script>

    <!-- IMPORTANTE -->
    <script src="js/components/floating-menu.js"></script>

    <script src="js/main.js"></script>

</body>
</html>
