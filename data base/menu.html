<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú • LzPlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body { background: linear-gradient(180deg, #070b14 0%, #000 100%); color: white; }
        .avatar { width: 90px; height: 90px; border-radius: 24px; object-fit: cover; border: 3px solid rgba(255,255,255,.1); }
    </style>
</head>
<body>

    <div class="topbar">
        <button onclick="history.back()">←</button>
        <div class="logo">LZPLAY</div>
    </div>

    <div class="profile-box">
        <img class="avatar" id="user-avatar" 
             src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg">
        <div>
            <h2 id="username">Cargando...</h2>
        </div>
    </div>

    <!-- Resto de tu menú aquí -->

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase/applelz.js"></script>

    <script>
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }

            document.getElementById("username").textContent = user.displayName || "Usuario";

            // === CARGA DEL ICONO ===
            try {
                const docRef = firebase.firestore().collection("users").doc(user.uid);
                const docSnap = await docRef.get();

                if (docSnap.exists) {
                    const data = docSnap.data();
                    
                    console.log("=== DATOS COMPLETOS DEL DOCUMENTO ===");
                    console.log(data);
                    console.log("=====================================");

                    // Intentamos obtener el icono de diferentes formas
                    const iconUrl = data.profileIcon || data.profileicon || data.avatar;

                    if (iconUrl) {
                        document.getElementById("user-avatar").src = iconUrl;
                        console.log("✅ Icono cargado correctamente:", iconUrl);
                    } else {
                        console.warn("⚠️ El campo 'profileIcon' NO existe en este documento.");
                        console.log("Campos disponibles:", Object.keys(data));
                    }
                } else {
                    console.warn("⚠️ El documento del usuario no existe.");
                }
            } catch (error) {
                console.error("❌ Error:", error);
            }
        });
    </script>
</body>
</html>
