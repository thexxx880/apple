<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
    <title>Selector de Iconos - LZPLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { 
            background-color: #0e1a2b; 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            padding: 24px; 
        }
        .icon-row {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
            margin-bottom: 40px;
        }
        .icon-row::-webkit-scrollbar { display: none; }
        
        .icono-item {
            flex: 0 0 auto;
            width: 100px;
            height: 100px;
            border-radius: 9999px;
            border: 4px solid transparent;
            transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,.15);
            scroll-snap-align: start;
            position: relative;
        }
        .icono-item:hover {
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.6);
            border-color: #2563eb;
        }
        .icono-item.selected {
            border-color: #2563eb;
            box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3);
            transform: scale(1.1);
        }
        .icono-item img {
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1 class="text-3xl font-bold text-center mb-8">Elige tu icono de perfil</h1>

    <!-- GRID DE ICONOS -->
    <div id="icon-grid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 gap-5 mb-10">
        <!-- Se genera con JavaScript -->
    </div>

    <!-- BOTONES -->
    <div class="flex flex-col sm:flex-row gap-4 max-w-md mx-auto mt-10">
        <button onclick="saveSelectedIcon()" 
                class="flex-1 py-4 bg-[#2563eb] hover:bg-[#1e40af] rounded-3xl font-semibold text-lg transition-all">
            Guardar icono
        </button>
        <button onclick="cancelSelection()" 
                class="flex-1 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-3xl font-semibold text-lg transition-all">
            Cancelar
        </button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDb1vEGCkNpcarttuwLLvuB40g8reRFTGM",
            authDomain: "applelz-b5883.firebaseapp.com",
            projectId: "applelz-b5883",
            storageBucket: "applelz-b5883.firebasestorage.app",
            messagingSenderId: "489468218632",
            appId: "1:489468218632:web:598a550f7ebe7c6de7b0bd"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const PROFILE_ICONS = [
            "https://i.pravatar.cc/300?img=1",
            "https://i.pravatar.cc/300?img=2",
            "https://i.pravatar.cc/300?img=3",
            "https://i.pravatar.cc/300?img=4",
            "https://i.pravatar.cc/300?img=5",
            "https://i.pravatar.cc/300?img=6",
            "https://i.pravatar.cc/300?img=7",
            "https://i.pravatar.cc/300?img=8",
            "https://i.pravatar.cc/300?img=9",
            "https://i.pravatar.cc/300?img=10",
            "https://i.pravatar.cc/300?img=11",
            "https://i.pravatar.cc/300?img=12",
            "https://i.pravatar.cc/300?img=13",
            "https://i.pravatar.cc/300?img=14",
            "https://i.pravatar.cc/300?img=15",
            "https://i.pravatar.cc/300?img=16"
        ];

        let currentUser = null;
        let selectedIconUrl = null;   // ← Solo una declaración

        // Cargar iconos
        function loadIconGrid() {
            const grid = document.getElementById("icon-grid");
            grid.innerHTML = "";

            PROFILE_ICONS.forEach(url => {
                const div = document.createElement("div");
                div.className = "icono-item";
                div.innerHTML = `<img src="${url}" alt="Icono">`;

                div.onclick = () => {
                    document.querySelectorAll(".icono-item").forEach(el => el.classList.remove("selected"));
                    div.classList.add("selected");
                    selectedIconUrl = url;
                };

                grid.appendChild(div);
            });
        }

        // Guardar en Firestore
        window.saveSelectedIcon = async function() {
            if (!selectedIconUrl || !currentUser) {
                alert("Por favor selecciona un icono");
                return;
            }

            try {
                await updateDoc(doc(db, "users", currentUser.uid), {
                    profileIcon: selectedIconUrl,
                    updatedAt: new Date()
                });

                alert("¡Icono guardado correctamente!");
                window.location.href = "menu.html";

            } catch (error) {
                console.error("Error:", error);
                alert("Error al guardar el icono");
            }
        };

        window.cancelSelection = function() {
            window.location.href = "menu.html";
        };

        // Cargar icono actual del usuario
        async function loadCurrentIcon(user) {
            currentUser = user;
            
            try {
                const docSnap = await getDoc(doc(db, "users", user.uid));
                
                if (docSnap.exists() && docSnap.data().profileIcon) {
                    const currentUrl = docSnap.data().profileIcon;
                    
                    setTimeout(() => {
                        const icons = document.querySelectorAll(".icono-item img");
                        icons.forEach(img => {
                            if (img.src === currentUrl) {
                                const parent = img.parentElement;
                                parent.classList.add("selected");
                                selectedIconUrl = currentUrl;
                            }
                        });
                    }, 300);
                } else {
                    // Seleccionar el primero por defecto
                    setTimeout(() => {
                        const first = document.querySelector(".icono-item");
                        if (first) first.click();
                    }, 300);
                }
            } catch (error) {
                console.error("Error cargando icono:", error);
            }
        }

        // Inicializar
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadCurrentIcon(user);
            } else {
                window.location.href = "login.html";
            }
        });

        // Cargar grid
        window.onload = function() {
            loadIconGrid();
        };
    </script>
</body>
</html>
