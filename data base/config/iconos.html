<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no"/>
    <title>Selector de Iconos - LZPLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background-color: #0e1a2b;
            color: white;
            font-family: 'Montserrat', sans-serif;
            padding: 24px;
        }
        .icon-row {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding-bottom: 8px;
            scroll-snap-type: x mandatory;
            margin-bottom: 40px;
        }
        .icon-row::-webkit-scrollbar { display: none; }
       
        .icono-item {
            flex: 0 0 auto;
            width: 100px;
            height: 100px;
            border-radius: 9999px;
            border: 4px solid transparent;
            transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,.15);
            scroll-snap-align: start;
            position: relative;
        }
        .icono-item:hover {
            transform: scale(1.15);
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.6);
            border-color: #2563eb;
        }
        .icono-item.selected {
            border-color: #2563eb;
            box-shadow: 0 0 0 8px rgba(37, 99, 235, 0.3);
            transform: scale(1.1);
        }
        .icono-item img {
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <h1 class="text-3xl font-bold text-center mb-8">Elige tu icono de perfil</h1>

    <!-- NETFLIX V.1 -->
    <h2 class="text-xl font-semibold mb-3">NETFLIX V.1</h2>
    <div class="icon-row" id="netflix-v1"></div>

    <!-- NETFLIX V.2 -->
    <h2 class="text-xl font-semibold mt-10 mb-3">NETFLIX V.2</h2>
    <div class="icon-row" id="netflix-v2"></div>

    <!-- Hora De Aventura -->
    <h2 class="text-xl font-semibold mt-10 mb-3">Hora De Aventura</h2>
    <div class="icon-row" id="aventura"></div>

    <!-- Teen Titans Go! -->
    <h2 class="text-xl font-semibold mt-10 mb-3">Teen Titans Go!</h2>
    <div class="icon-row" id="titans"></div>

    <!-- ZeroTwo -->
    <h2 class="text-xl font-semibold mt-10 mb-3">ZeroTwo - Darling in the franxx</h2>
    <div class="icon-row" id="zerotwo"></div>

    <!-- DISNEY+ Marvel -->
    <h2 class="text-xl font-semibold mt-10 mb-3">DISNEY+ Icons Marvel</h2>
    <div class="icon-row" id="marvel"></div>

    <!-- BOTONES -->
    <div class="flex flex-col sm:flex-row gap-4 max-w-md mx-auto mt-10">
        <button onclick="saveSelectedIcon()"
                class="flex-1 py-4 bg-[#2563eb] hover:bg-[#1e40af] rounded-3xl font-semibold text-lg transition-all">
            Guardar icono
        </button>
        <button onclick="cancelSelection()"
                class="flex-1 py-4 bg-white/10 hover:bg-white/20 border border-white/20 rounded-3xl font-semibold text-lg transition-all">
            Cancelar
        </button>
    </div>

            ]
        };

        let selectedIconUrl = null;   // ← Declarado solo una vez

        // Cargar todos los iconos en sus filas
        function loadIcons() {
            const sections = {
                "netflix-v1": document.getElementById("netflix-v1"),
                "netflix-v2": document.getElementById("netflix-v2"),
                "aventura": document.getElementById("aventura"),
                "titans": document.getElementById("titans"),
                "zerotwo": document.getElementById("zerotwo"),
                "marvel": document.getElementById("marvel")
            };

            Object.keys(iconos).forEach(category => {
                const row = sections[category];
                if (!row) return;

                iconos[category].forEach(url => {
                    const div = document.createElement("div");
                    div.className = "icono-item";
                    div.innerHTML = `<img src="${url}" alt="Icono">`;

                    div.onclick = () => {
                        document.querySelectorAll(".icono-item").forEach(el => el.classList.remove("selected"));
                        div.classList.add("selected");
                        selectedIconUrl = url;
                    };

                    row.appendChild(div);
                });
            });
        }

        // Guardar en Firestore
        window.saveSelectedIcon = async function() {
            if (!selectedIconUrl || !currentUser) {
                alert("Por favor selecciona un icono");
                return;
            }

            try {
                await updateDoc(doc(db, "users", currentUser.uid), {
                    profileIcon: selectedIconUrl,
                    updatedAt: new Date()
                });

                alert("¡Icono guardado correctamente!");
                window.location.href = "menu.html";

            } catch (error) {
                console.error("Error:", error);
                alert("Error al guardar el icono");
            }
        };

        window.cancelSelection = function() {
            window.location.href = "menu.html";
        };

        // Cargar icono actual del usuario
        async function loadCurrentIcon(user) {
            currentUser = user;
           
            try {
                const docSnap = await getDoc(doc(db, "users", user.uid));
               
                if (docSnap.exists() && docSnap.data().profileIcon) {
                    const currentUrl = docSnap.data().profileIcon;
                   
                    setTimeout(() => {
                        const allIcons = document.querySelectorAll(".icono-item img");
                        allIcons.forEach(img => {
                            if (img.src === currentUrl) {
                                const parent = img.parentElement;
                                parent.classList.add("selected");
                                selectedIconUrl = currentUrl;
                            }
                        });
                    }, 400);
                } else {
                    // Seleccionar el primer icono por defecto
                    setTimeout(() => {
                        const first = document.querySelector(".icono-item");
                        if (first) first.click();
                    }, 400);
                }
            } catch (error) {
                console.error("Error cargando icono:", error);
            }
        }

        // Inicializar
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loadCurrentIcon(user);
            } else {
                window.location.href = "login.html";
            }
        });

        // Cargar grid al iniciar
        window.onload = function() {
            // Cargar iconos
            const sections = {
                "netflix-v1": document.getElementById("netflix-v1"),
                "netflix-v2": document.getElementById("netflix-v2"),
                "aventura": document.getElementById("aventura"),
                "titans": document.getElementById("titans"),
                "zerotwo": document.getElementById("zerotwo"),
                "marvel": document.getElementById("marvel")
            };

            Object.keys(iconos).forEach(category => {
                const row = sections[category];
                if (!row) return;

                iconos[category].forEach(url => {
                    const div = document.createElement("div");

                    div.innerHTML = `<img src="${url}" alt="Icono">`;

                    div.onclick = () => {
                        document.querySelectorAll(".icono-item").forEach(el => el.classList.remove("selected"));
                        div.classList.add("selected");
                        selectedIconUrl = url;
                    };

                    row.appendChild(div);
                });
            });
        };
