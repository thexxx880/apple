<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista • LzPlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/load.css">
    <script src="js/components/load.js"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase/applelz.js"></script>

    <style>
      /* =====================================================
   LZPLAY - MI LISTA (DISEÑO NUEVO 2026)
===================================================== */

@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Poppins',sans-serif;
    color:#fff;
    min-height:100vh;
    overflow-x:hidden;

    background:
    radial-gradient(
        circle at top,
        #0f172a 0%,
        #020817 55%,
        #01030a 100%
    );
}

/* ==========================================
   SCROLLBAR
========================================== */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#020817;
}

::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:50px;
}

::-webkit-scrollbar-thumb:hover{
    background:#475569;
}

/* ==========================================
   TOPBAR
========================================== */

.topbar{
    position:sticky;
    top:0;
    z-index:1000;

    height:75px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 25px;

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    background:rgba(2,8,23,.85);

    border-bottom:1px solid rgba(255,255,255,.05);
}

.back-btn{
    width:45px;
    height:45px;

    border:none;
    border-radius:14px;

    background:#0f172a;
    color:white;

    cursor:pointer;

    transition:.25s;
}

.back-btn:hover{
    transform:translateY(-2px);
    background:#1e293b;
}

.back-btn i{
    font-size:16px;
}

.logo{
    font-size:1.3rem;
    font-weight:800;
    letter-spacing:2px;

    background:linear-gradient(
        90deg,
        #ffffff,
        #38bdf8
    );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

/* ==========================================
   CONTENEDOR
========================================== */

.mylist-container{
    max-width:1600px;
    margin:auto;
    padding:35px 25px 80px;
}

/* ==========================================
   HEADER
========================================== */

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:15px;

    margin-bottom:35px;
}

.header h1{
    font-size:2.3rem;
    font-weight:800;
}

.header p{
    color:#94a3b8;
}

.clear-btn,
.header button{
    display:flex;
    align-items:center;
    gap:10px;

    border:none;

    background:#ef4444;
    color:white;

    padding:12px 18px;

    border-radius:14px;

    font-weight:600;
    cursor:pointer;

    transition:.25s;
}

.clear-btn:hover,
.header button:hover{
    transform:translateY(-2px);
    background:#dc2626;
}

/* ==========================================
   GRID
========================================== */

.mylist-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(350px,1fr));
    gap:24px;
}

/* ==========================================
   CARD
========================================== */

.card{
    position:relative;

    overflow:hidden;
    border-radius:24px;

    background:#0f172a;

    cursor:pointer;

    transition:
    transform .35s ease,
    box-shadow .35s ease;

    border:1px solid rgba(255,255,255,.05);
}

.card:hover{
    transform:
    translateY(-8px)
    scale(1.02);

    box-shadow:
    0 20px 50px rgba(0,0,0,.35);
}

/* ==========================================
   BACKDROP
========================================== */

.backdrop{
    width:100%;
    aspect-ratio:16/9;
    object-fit:cover;

    transition:transform .6s ease;
}

.card:hover .backdrop{
    transform:scale(1.08);
}

/* ==========================================
   OVERLAY
========================================== */

.card::after{
    content:'';

    position:absolute;
    inset:0;

    background:
    linear-gradient(
        to top,
        rgba(2,8,23,.98) 10%,
        rgba(2,8,23,.6) 45%,
        rgba(2,8,23,.15) 100%
    );

    pointer-events:none;
}

/* ==========================================
   LOGO TMDB
========================================== */

.logo-img{
    position:absolute;

    left:18px;
    bottom:70px;

    max-width:180px;
    max-height:70px;

    object-fit:contain;

    z-index:3;

    filter:
    drop-shadow(
        0 6px 12px rgba(0,0,0,.8)
    );
}

/* ==========================================
   BOTÓN ELIMINAR
========================================== */

.remove-btn{
    position:absolute;

    top:15px;
    right:15px;

    width:42px;
    height:42px;

    border:none;
    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    rgba(239,68,68,.92);

    backdrop-filter:blur(10px);

    color:white;

    cursor:pointer;

    z-index:5;

    transition:.25s;
}

.remove-btn:hover{
    transform:scale(1.15);
    background:#dc2626;
}

.remove-btn i{
    font-size:14px;
}

/* ==========================================
   INFO
========================================== */

.info{
    position:absolute;

    left:0;
    right:0;
    bottom:0;

    z-index:4;

    padding:18px;
}

.title{
    font-size:1rem;
    font-weight:700;

    line-height:1.3;

    margin-bottom:8px;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.meta{
    display:flex;
    align-items:center;
    gap:10px;

    color:#cbd5e1;
    font-size:.85rem;
}

.year{
    color:#94a3b8;
}

/* ==========================================
   CONTADOR
========================================== */

.stats-card{
    background:#0f172a;

    padding:14px 22px;

    border-radius:18px;

    border:1px solid rgba(255,255,255,.06);

    display:flex;
    flex-direction:column;
}

.stats-card span{
    font-size:.8rem;
    color:#94a3b8;
}

.stats-card strong{
    font-size:1.4rem;
}

/* ==========================================
   EMPTY STATE
========================================== */

.empty{
    min-height:60vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;
}

.empty-icon{
    font-size:90px;
    margin-bottom:20px;

    opacity:.8;
}

.empty h2{
    margin-bottom:10px;
}

.empty p{
    color:#94a3b8;
}

/* ==========================================
   LOADER
========================================== */

.loading{
    text-align:center;
    padding:80px 20px;
}

.loading i{
    font-size:2rem;
    color:#38bdf8;
    margin-bottom:15px;
}

.loading p{
    color:#94a3b8;
}

/* ==========================================
   MODAL
========================================== */

.modal{
    position:fixed;
    inset:0;

    display:none;
    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.7);

    backdrop-filter:blur(10px);

    z-index:99999;

    padding:20px;
}

.modal-content{
    width:100%;
    max-width:420px;

    background:#0f172a;

    border-radius:24px;

    padding:30px;

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
    0 30px 80px rgba(0,0,0,.65);

    animation:modalIn .25s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.95);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.modal-content h3{
    margin-bottom:12px;
    font-size:1.4rem;
}

.modal-content p{
    color:#94a3b8;
    line-height:1.5;
}

/* ==========================================
   BOTONES MODAL
========================================== */

.modal-buttons{
    display:flex;
    gap:12px;
    margin-top:25px;
}

.modal-buttons button{
    flex:1;

    border:none;

    padding:13px;

    border-radius:14px;

    font-weight:600;

    cursor:pointer;

    transition:.25s;
}

.btn-cancel{
    background:#1e293b;
    color:white;
}

.btn-cancel:hover{
    background:#334155;
}

.btn-delete{
    background:#ef4444;
    color:white;
}

.btn-delete:hover{
    background:#dc2626;
}

/* ==========================================
   EFECTO GLASS
========================================== */

.glass{
    backdrop-filter:blur(20px);
    background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);
}

/* ==========================================
   RESPONSIVE
========================================== */

@media(max-width:900px){

    .mylist-grid{
        grid-template-columns:1fr;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .header h1{
        font-size:1.9rem;
    }
}

@media(max-width:600px){

    .topbar{
        padding:0 15px;
    }

    .mylist-container{
        padding:25px 15px 60px;
    }

    .header h1{
        font-size:1.7rem;
    }

    .logo-img{
        max-width:140px;
        max-height:55px;
    }

    .info{
        padding:15px;
    }

    .title{
        font-size:.95rem;
    }
}
    </style>
</head>
<body>

<!-- LOADER -->
<div id="loader">
    <div class="loader-glow"></div>
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi3dK3-XAKrEia-lWmiUqAYRfFQ1lR9eJX6ZZH8e_vHf576qf9GJjIWBW9Jg5LsilXX7WO2MOEkg5gzc4pESziaPeMJ9ws9mwtCDdp3p_17D0e0Uop_ZxavwwJeNLBvoyZJ0cxTKQpjzrJIR6LjJslB24tj-77AYrRCacQ3F2S2VPoXpPzPhM1zndxyd1Rg/s3307/B64D5386-DCA4-410B-A0A6-6ACB19D0A06F.png"
         alt="LzPlay" class="loader-logo">
    <div class="loader-bar">
        <span></span>
    </div>
</div>

<!-- HEADER -->
<div class="topbar">
    <button class="back-btn" onclick="window.location.href='index.html'">
        <i class="fa-solid fa-arrow-left"></i>
    </button>
    <div class="logo">LZPLAY</div>
    <div style="width:45px;"></div>
</div>

<!-- CONTENIDO PRINCIPAL -->
<div class="mylist-container">
    <div class="header">
        <h1>⭐ Mi Lista</h1>
        <button onclick="clearAllFavorites()" style="background:#ef4444; color:white; border:none; padding:10px 18px; border-radius:12px; cursor:pointer;">
            <i class="fa-solid fa-trash"></i> Limpiar
        </button>
    </div>

    <div id="mylistContainer"></div>
</div>

<!-- MODAL DE CONFIRMACIÓN -->
<div id="confirmModal" class="modal">
    <div class="modal-content">
        <h3>¿Eliminar de Mi Lista?</h3>
        <p id="modalItemTitle"></p>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="cancelDelete()">Cancelar</button>
            <button class="btn-delete" onclick="confirmDelete()">Eliminar</button>
        </div>
    </div>
</div>

<script>
let currentUser = null;
let itemToDelete = null;

const TMDB_API_KEY = "38e497c6c1a043d1341416e80915669f";

firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) {
        window.location.href = "login.html";
        return;
    }
    currentUser = user;
    loadMyList();
});

async function loadMyList() {
    const container = document.getElementById("mylistContainer");
    container.innerHTML = `<div style="text-align:center; padding:80px 20px; color:#64748b;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:2rem;"></i><br><br>Cargando tu lista...
    </div>`;

    try {
        const snapshot = await firebase.firestore()
            .collection("users")
            .doc(currentUser.uid)
            .collection("myList")
            .get();

        let items = [];

        for (const docSnap of snapshot.docs) {
            const data = docSnap.data();
            const tmdb = await getTMDBInfo(data.type, data.id);

            if (tmdb) {
                items.push({
                    ...data,
                    docId: docSnap.id,
                    title: tmdb.title || tmdb.name || "Sin título",
                    backdrop: tmdb.backdrop_path 
                        ? `https://image.tmdb.org/t/p/w780${tmdb.backdrop_path}` 
                        : "https://via.placeholder.com/780x160/1e2937/64748b?text=Sin+Imagen",
                    logo: tmdb.images?.logos?.[0]?.file_path 
                        ? `https://image.tmdb.org/t/p/w500${tmdb.images.logos[0].file_path}` 
                        : null,
                    year: (tmdb.release_date || tmdb.first_air_date || "").substring(0, 4) || "N/A"
                });
            }
        }

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📭</div>
                    <h2>Tu lista está vacía</h2>
                    <p>Aún no tienes contenido guardado.</p>
                </div>`;
            return;
        }

        let html = `<div class="mylist-grid">`;
        
        items.forEach(item => {
            html += `
                <div class="card" onclick="goToContent('${item.url || '#'}')">
                    <img src="${item.backdrop}" class="backdrop" alt="${item.title}">
                    
                    ${item.logo ? `<img src="${item.logo}" class="logo" alt="logo">` : ''}
                    
                    <button class="remove-btn" onclick="event.stopImmediatePropagation(); prepareDelete('${item.docId}', '${item.title.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                    
                    <div class="info">
                        <div class="title">${item.title}</div>
                        <div class="year">${item.year}</div>
                    </div>
                </div>`;
        });

        html += `</div>`;
        container.innerHTML = html;

    } catch (error) {
        console.error("Error:", error);
        container.innerHTML = `<div style="text-align:center; color:#ef4444; padding:50px;">Error al cargar la lista</div>`;
    }
}

async function getTMDBInfo(type, id) {
    try {
        const endpoint = type === "movie" ? "movie" : "tv";
        const url = `https://api.themoviedb.org/3/${endpoint}/${id}?api_key=${TMDB_API_KEY}&language=es-ES&append_to_response=images`;
        const res = await fetch(url);
        return await res.json();
    } catch (e) {
        console.error("TMDB Error:", e);
        return null;
    }
}

function goToContent(url) {
    if (url && url !== "#") {
        window.location.href = url;
    }
}

// ==================== ELIMINAR ====================
function prepareDelete(docId, title) {
    itemToDelete = docId;
    document.getElementById("modalItemTitle").textContent = title;
    document.getElementById("confirmModal").style.display = "flex";
}

function cancelDelete() {
    document.getElementById("confirmModal").style.display = "none";
    itemToDelete = null;
}

async function confirmDelete() {
    if (!itemToDelete || !currentUser) return;

    try {
        await firebase.firestore()
            .collection("users")
            .doc(currentUser.uid)
            .collection("myList")
            .doc(itemToDelete)
            .delete();

        document.getElementById("confirmModal").style.display = "none";
        loadMyList();
    } catch (error) {
        alert("❌ Error al eliminar el contenido");
    }
}

async function clearAllFavorites() {
    if (!confirm("⚠️ ¿Eliminar TODA tu lista de favoritos?")) return;

    try {
        const snapshot = await firebase.firestore()
            .collection("users")
            .doc(currentUser.uid)
            .collection("myList")
            .get();

        const batch = firebase.firestore().batch();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();

        loadMyList();
    } catch (e) {
        alert("❌ Error al limpiar la lista");
    }
}
</script>
</body>
</html>
