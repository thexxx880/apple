<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Favoritos</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}
body{
    background:#020817;
    color:#fff;
    min-height:100vh;
    padding:30px;
}
.container{
    max-width:1400px;
    margin:auto;
}
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:30px;
}
.header h1{
    font-size:2rem;
    font-weight:700;
}
.count{
    background:#0f172a;
    padding:8px 15px;
    border-radius:10px;
    color:#94a3b8;
}
.favorites-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:20px;
}
.card{
    background:#0f172a;
    border-radius:15px;
    overflow:hidden;
    transition:.3s;
    position:relative;
}
.card:hover{
    transform:translateY(-5px);
}
.poster{
    width:100%;
    height:270px;
    object-fit:cover;
}
.info{
    padding:12px;
}
.title{
    font-size:14px;
    font-weight:600;
    margin-bottom:4px;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
}
.year{
    font-size:13px;
    color:#94a3b8;
    margin-bottom:10px;
}
.remove-btn{
    width:100%;
    border:none;
    background:#ef4444;
    color:white;
    padding:10px;
    cursor:pointer;
    font-weight:600;
    transition:.3s;
}
.remove-btn:hover{
    background:#dc2626;
}
.empty{
    text-align:center;
    padding:80px 20px;
    color:#94a3b8;
}
.empty-icon{
    font-size:70px;
    margin-bottom:15px;
}
.clear-all{
    background:#dc2626;
    border:none;
    color:white;
    padding:10px 18px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
}
.loading{
    text-align:center;
    padding:50px;
    color:#94a3b8;
}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⭐ Mis Favoritos</h1>
        <div style="display:flex;gap:10px;align-items:center;">
            <span class="count" id="count">0 Favoritos</span>
            <button class="clear-all" onclick="clearFavorites()">Limpiar Todo</button>
        </div>
    </div>
    <div id="favoritesContainer"></div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

// Configuración Firebase
const firebaseConfig = {
    apiKey: "AIzaSyDb1vEGCkNpcarttuwLLvuB40g8reRFTGM",
    authDomain: "applelz-b5883.firebaseapp.com",
    projectId: "applelz-b5883",
    storageBucket: "applelz-b5883.firebasestorage.app",
    messagingSenderId: "489468218632",
    appId: "1:489468218632:web:598a550f7ebe7c6de7b0bd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const TMDB_API_KEY = "38e497c6c1a043d1341416e80915669f";
const TMDB_BASE_URL = "https://api.themoviedb.org/3";

let currentUser = null;

// Función para obtener datos de TMDB
async function getTMDBData(type, id) {
    try {
        const endpoint = type === "movie" ? "movie" : "tv";
        const res = await fetch(`${TMDB_BASE_URL}/${endpoint}/${id}?api_key=${TMDB_API_KEY}&language=es-ES`);
        const data = await res.json();
        return data;
    } catch (e) {
        console.error("Error TMDB:", e);
        return null;
    }
}

async function loadFavorites() {
    const container = document.getElementById("favoritesContainer");
    const countEl = document.getElementById("count");

    if (!currentUser) {
        container.innerHTML = `<div class="empty"><p>Debes iniciar sesión</p></div>`;
        return;
    }

    container.innerHTML = `<div class="loading">Cargando tus favoritos...</div>`;

    try {
        const myListRef = collection(db, "users", currentUser.uid, "myList");
        const snapshot = await getDocs(myListRef);

        const favorites = [];
        for (const docSnap of snapshot.docs) {
            const item = docSnap.data();
            const tmdbData = await getTMDBData(item.type, item.id);

            if (tmdbData) {
                favorites.push({
                    ...item,
                    title: tmdbData.title || tmdbData.name,
                    poster: tmdbData.poster_path 
                        ? `https://image.tmdb.org/t/p/w500${tmdbData.poster_path}` 
                        : "https://via.placeholder.com/500x750?text=No+Image",
                    year: tmdbData.release_date || tmdbData.first_air_date 
                        ? (tmdbData.release_date || tmdbData.first_air_date).substring(0,4) 
                        : "N/A",
                    backdrop: tmdbData.backdrop_path 
                        ? `https://image.tmdb.org/t/p/original${tmdbData.backdrop_path}` 
                        : null,
                    docId: docSnap.id // Para eliminar
                });
            }
        }

        countEl.textContent = `${favorites.length} Favoritos`;

        if (favorites.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">💔</div>
                    <h2>No tienes favoritos guardados</h2>
                    <p>Agrega películas o series a tu lista.</p>
                </div>
            `;
            return;
        }

        container.innerHTML = `
            <div class="favorites-grid">
                ${favorites.map(item => `
                    <div class="card">
                        <img src="${item.poster}" class="poster" alt="${item.title}">
                        <div class="info">
                            <div class="title">${item.title}</div>
                            <div class="year">${item.year}</div>
                        </div>
                        <button class="remove-btn" onclick="removeFavorite('${item.docId}')">
                            Eliminar
                        </button>
                    </div>
                `).join("")}
            </div>
        `;

    } catch (error) {
        console.error("Error cargando favoritos:", error);
        container.innerHTML = `<div class="empty"><p>Error al cargar favoritos</p></div>`;
    }
}

window.removeFavorite = async function(docId) {
    if (!currentUser) return;
    if (!confirm("¿Eliminar este contenido de favoritos?")) return;

    try {
        await deleteDoc(doc(db, "users", currentUser.uid, "myList", docId));
        loadFavorites();
    } catch (e) {
        alert("Error al eliminar");
    }
};

window.clearFavorites = async function() {
    if (!currentUser) return;
    if (!confirm("¿Eliminar TODOS los favoritos?")) return;

    try {
        const myListRef = collection(db, "users", currentUser.uid, "myList");
        const snapshot = await getDocs(myListRef);
        
        for (const docSnap of snapshot.docs) {
            await deleteDoc(docSnap.ref);
        }
        loadFavorites();
    } catch (e) {
        alert("Error al limpiar favoritos");
    }
};

// Detectar usuario autenticado
onAuthStateChanged(auth, (user) => {
    currentUser = user;
    if (user) {
        loadFavorites();
    } else {
        document.getElementById("favoritesContainer").innerHTML = `
            <div class="empty">
                <p>Inicia sesión para ver tus favoritos</p>
            </div>`;
    }
});
</script>
</body>
</html>
