<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Lista • LzPlay</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/load.css">
    <script src="js/components/load.js"></script>
  
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="js/firebase/applelz.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
       
        * { margin:0; padding:0; box-sizing:border-box; }
       
        body {
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f172a 0%, #020817 55%, #01030a 100%);
        }

        /* ==================== TOPBAR ==================== */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            backdrop-filter: blur(20px);
            background: rgba(2, 8, 23, 0.85);
            border-bottom: 1px solid rgba(255,255,255,.05);
        }
        .back-btn {
            width: 45px; height: 45px;
            border: none; border-radius: 14px;
            background: #0f172a; color: white;
            cursor: pointer; transition: .3s;
        }
        .back-btn:hover { background: #1e293b; transform: translateY(-2px); }
        .logo {
            font-size: 1.35rem; font-weight: 800; letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* ==================== CONTENEDOR ==================== */
        .mylist-container {
            max-width: 1600px;
            margin: auto;
            padding: 35px 25px 80px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .header h1 { 
            font-size: 2.5rem; 
            font-weight: 700; 
        }

        .clear-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ef4444;
            color: white;
            padding: 12px 22px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: .3s;
        }
        .clear-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        /* ==================== GRID ==================== */
        .mylist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 28px;
        }

        /* ==================== CARD - Estilo Disney+ ==================== */
        .card {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background: #0f172a;
            cursor: pointer;
            transition: all 0.4s ease;
        }
        .card:hover {
            transform: translateY(-12px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .poster {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .card:hover .poster {
            transform: scale(1.08);
        }

        /* Overlay oscuro */
        .card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.85));
            opacity: 0;
            transition: opacity 0.4s;
        }
        .card:hover::after {
            opacity: 1;
        }

        /* Título */
        .card-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 16px 16px;
            z-index: 5;
            font-weight: 600;
            font-size: 1.05rem;
            line-height: 1.3;
            text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
        }
        .card:hover .card-title {
            opacity: 1;
            transform: translateY(0);
        }

        /* Badge Tipo */
        .type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 0.78rem;
            font-weight: 600;
            z-index: 6;
            backdrop-filter: blur(10px);
        }
        .type-movie { background: rgba(59, 130, 246, 0.95); color: white; }
        .type-tv { background: rgba(236, 72, 153, 0.95); color: white; }

        /* Botón Eliminar */
        .remove-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 38px; height: 38px;
            border: none;
            border-radius: 50%;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            z-index: 7;
            cursor: pointer;
            transition: all 0.3s;
        }
        .remove-btn:hover {
            background: #dc2626;
            transform: scale(1.1);
        }

        /* Año */
        .year {
            position: absolute;
            bottom: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            z-index: 6;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .mylist-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }
        @media (max-width: 480px) {
            .mylist-container { padding: 25px 15px 60px; }
        }

        /* Empty State */
        .empty {
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #94a3b8;
        }
        .empty-icon { font-size: 85px; margin-bottom: 20px; opacity: 0.7; }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-glow"></div>
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEi3dK3-XAKrEia-lWmiUqAYRfFQ1lR9eJX6ZZH8e_vHf576qf9GJjIWBW9Jg5LsilXX7WO2MOEkg5gzc4pESziaPeMJ9ws9mwtCDdp3p_17D0e0Uop_ZxavwwJeNLBvoyZJ0cxTKQpjzrJIR6LjJslB24tj-77AYrRCacQ3F2S2VPoXpPzPhM1zndxyd1Rg/s3307/B64D5386-DCA4-410B-A0A6-6ACB19D0A06F.png"
             alt="LzPlay" class="loader-logo">
        <div class="loader-bar"><span></span></div>
    </div>

    <!-- TOPBAR -->
    <div class="topbar">
        <button class="back-btn" onclick="window.location.href='index.html'">
            <i class="fa-solid fa-arrow-left"></i>
        </button>
        <div class="logo">LZPLAY</div>
        <div style="width:45px;"></div>
    </div>

    <!-- CONTENIDO -->
    <div class="mylist-container">
        <div class="header">
            <h1>⭐ Mi Lista</h1>
            <button onclick="prepareClearAll()" class="clear-btn">
                <i class="fa-solid fa-trash"></i> Limpiar Todo
            </button>
        </div>
        <div id="mylistContainer"></div>
    </div>

    <!-- MODAL ELIMINAR ITEM -->
    <div id="confirmModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:#0f172a; padding:30px; border-radius:20px; max-width:420px; width:90%; border:1px solid rgba(255,255,255,0.08);">
            <h3>¿Eliminar de Mi Lista?</h3>
            <p id="modalItemTitle" style="color:#94a3b8; margin:15px 0 25px;"></p>
            <div style="display:flex; gap:12px;">
                <button onclick="cancelDelete()" style="flex:1; padding:14px; border-radius:14px; background:#1e293b; color:white; border:none; font-weight:600;">Cancelar</button>
                <button onclick="confirmDelete()" style="flex:1; padding:14px; border-radius:14px; background:#ef4444; color:white; border:none; font-weight:600;">Eliminar</button>
            </div>
        </div>
    </div>

    <!-- MODAL LIMPIAR TODO -->
    <div id="clearAllModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); backdrop-filter:blur(10px); z-index:99999; align-items:center; justify-content:center;">
        <div style="background:#0f172a; padding:30px; border-radius:20px; max-width:420px; width:90%; border:1px solid rgba(255,255,255,0.08);">
            <h3>¿Limpiar toda la lista?</h3>
            <p style="color:#94a3b8; margin:15px 0 25px;">Esta acción eliminará todos los contenidos de tu lista de forma permanente.</p>
            <div style="display:flex; gap:12px;">
                <button onclick="cancelClearAll()" style="flex:1; padding:14px; border-radius:14px; background:#1e293b; color:white; border:none; font-weight:600;">Cancelar</button>
                <button onclick="confirmClearAll()" style="flex:1; padding:14px; border-radius:14px; background:#ef4444; color:white; border:none; font-weight:600;">Sí, Limpiar Todo</button>
            </div>
        </div>
    </div>

<script>
let currentUser = null;
let itemToDelete = null;
const TMDB_API_KEY = "38e497c6c1a043d1341416e80915669f";

firebase.auth().onAuthStateChanged(async (user) => {
    if (!user) return window.location.href = "login.html";
    currentUser = user;
    loadMyList();
});

async function loadMyList() {
    const container = document.getElementById("mylistContainer");
    container.innerHTML = `<div style="text-align:center;padding:80px;color:#64748b;">
        <i class="fa-solid fa-spinner fa-spin" style="font-size:2.2rem;"></i><br><br>Cargando tu lista...
    </div>`;

    try {
        const snapshot = await firebase.firestore()
            .collection("users")
            .doc(currentUser.uid)
            .collection("myList")
            .get();

        let items = [];
        for (const docSnap of snapshot.docs) {
            const data = docSnap.data();
            const tmdb = await getTMDBInfo(data.type, data.id);
            if (tmdb) {
                items.push({
                    ...data,
                    docId: docSnap.id,
                    title: tmdb.title || tmdb.name || "Sin título",
                    poster: tmdb.poster_path ? `https://image.tmdb.org/t/p/w500${tmdb.poster_path}` : "https://via.placeholder.com/500x750/1e2937/64748b?text=Sin+Poster",
                    year: (tmdb.release_date || tmdb.first_air_date || "").substring(0, 4) || "N/A",
                    type: data.type
                });
            }
        }

        if (items.length === 0) {
            container.innerHTML = `
                <div class="empty">
                    <div class="empty-icon">📭</div>
                    <h2>Tu lista está vacía</h2>
                    <p>Aún no tienes contenido guardado.</p>
                </div>`;
            return;
        }

        let html = `<div class="mylist-grid">`;
        items.forEach(item => {
            const typeText = item.type === "movie" ? "Película" : "Serie";
            const typeClass = item.type === "movie" ? "type-movie" : "type-tv";

            html += `
                <div class="card" onclick="goToContent('${item.url || '#'}')">
                    <img src="${item.poster}" class="poster" alt="${item.title}">
                    
                    <div class="type-badge ${typeClass}">${typeText}</div>
                    
                    <button class="remove-btn" onclick="event.stopImmediatePropagation(); prepareDelete('${item.docId}', '${item.title.replace(/'/g, "\\'")}')">
                        <i class="fa-solid fa-trash"></i>
                    </button>

                    <div class="year">${item.year}</div>
                    
                    <div class="card-title">${item.title}</div>
                </div>`;
        });
        html += `</div>`;
        container.innerHTML = html;

    } catch (error) {
        console.error(error);
        container.innerHTML = `<div style="text-align:center;color:#ef4444;padding:60px;">Error al cargar la lista</div>`;
    }
}

// ==================== MODALES ====================
function prepareDelete(docId, title) {
    itemToDelete = docId;
    document.getElementById("modalItemTitle").textContent = title;
    document.getElementById("confirmModal").style.display = "flex";
}

function cancelDelete() {
    document.getElementById("confirmModal").style.display = "none";
}

async function confirmDelete() {
    if (!itemToDelete || !currentUser) return;
    try {
        await firebase.firestore().collection("users").doc(currentUser.uid).collection("myList").doc(itemToDelete).delete();
        document.getElementById("confirmModal").style.display = "none";
        loadMyList();
    } catch (error) {
        alert("❌ Error al eliminar");
    }
}

function prepareClearAll() {
    document.getElementById("clearAllModal").style.display = "flex";
}

function cancelClearAll() {
    document.getElementById("clearAllModal").style.display = "none";
}

async function confirmClearAll() {
    try {
        const snapshot = await firebase.firestore()
            .collection("users")
            .doc(currentUser.uid)
            .collection("myList")
            .get();
       
        const batch = firebase.firestore().batch();
        snapshot.docs.forEach(doc => batch.delete(doc.ref));
        await batch.commit();
       
        document.getElementById("clearAllModal").style.display = "none";
        loadMyList();
    } catch (e) {
        alert("❌ Error al limpiar la lista");
    }
}

// ==================== OTRAS FUNCIONES ====================
async function getTMDBInfo(type, id) {
    try {
        const endpoint = type === "movie" ? "movie" : "tv";
        const url = `https://api.themoviedb.org/3/${endpoint}/${id}?api_key=${TMDB_API_KEY}&language=es-ES&append_to_response=images`;
        const res = await fetch(url);
        return await res.json();
    } catch (e) {
        console.error(e);
        return null;
    }
}

function goToContent(url) {
    if (url && url !== "#") window.location.href = url;
}
</script>
</body>
</html>
