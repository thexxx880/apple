<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mi Lista - LzPlay</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
padding:20px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.title{
font-size:34px;
font-weight:700;
}

.back-btn{
background:#111;
border:none;
color:#fff;
padding:12px 18px;
border-radius:14px;
cursor:pointer;
font-size:14px;
}

.grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));
gap:20px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
cursor:pointer;
position:relative;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.poster{
width:100%;
aspect-ratio:2/3;
object-fit:cover;
background:#151515;
display:block;
}

.info{
padding:14px;
}

.movie-title{
font-size:15px;
font-weight:600;
line-height:1.4;
margin-bottom:5px;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}

.year{
font-size:13px;
color:#aaa;
}

.remove-btn{
position:absolute;
top:10px;
right:10px;
width:40px;
height:40px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.85);
color:#fff;
cursor:pointer;
z-index:5;
}

.empty{
text-align:center;
margin-top:100px;
color:#888;
}

.loading{
text-align:center;
margin-top:100px;
color:#888;
}

</style>
</head>
<body>

<div class="header">

<h1 class="title">
Mi Lista
</h1>

<button
class="back-btn"
onclick="history.back()">

<i class="fa-solid fa-arrow-left"></i>
Regresar

</button>

</div>

<div id="content">

<div class="loading">
Cargando...
</div>

</div>

<script>

const TMDB_API_KEY =
"38e497c6c1a043d1341416e80915669f";

const firebaseConfig = {
apiKey:"AIzaSyDb1vEGCkNpcarttuwLLvuB40g8reRFTGM",
authDomain:"applelz-b5883.firebaseapp.com",
projectId:"applelz-b5883",
storageBucket:"applelz-b5883.firebasestorage.app",
messagingSenderId:"489468218632",
appId:"1:489468218632:web:598a550f7ebe7c6de7b0bd"
};

firebase.initializeApp(firebaseConfig);

const auth =
firebase.auth();

const db =
firebase.firestore();

const content =
document.getElementById(
"content"
);

auth.onAuthStateChanged(
(user)=>{

if(!user){

location.href =
"https://lzplayhd.online/apple/login.html";

return;
}

loadMyList(user.uid);

});

async function loadMyList(uid){

const snapshot =
await db.collection("users")
.doc(uid)
.collection("myList")
.orderBy("addedAt","desc")
.get();

if(snapshot.empty){

content.innerHTML=`
<div class="empty">
<h2>Tu lista está vacía</h2>
</div>
`;

return;
}

let html =
`<div class="grid">`;

for(const doc of snapshot.docs){

const item =
doc.data();

try{

const res =
await fetch(
`https://api.themoviedb.org/3/${item.type}/${item.id}?api_key=${TMDB_API_KEY}&language=es-ES`
);

const data =
await res.json();

const poster =
data.poster_path
? `https://image.tmdb.org/t/p/w500${data.poster_path}`
: "";

const title =
data.title
|| data.name
|| "Sin título";

const year =
(
data.release_date
||
data.first_air_date
||
""
).slice(0,4);

html += `

<div class="card"
onclick="openContent('${item.url}')">

<button
class="remove-btn"
onclick="
event.stopPropagation();
removeItem('${doc.id}')
">

<i class="fa-solid fa-xmark"></i>

</button>

<img
class="poster"
src="${poster}">

<div class="info">

<div class="movie-title">
${title}
</div>

<div class="year">
${year}
</div>

</div>

</div>
`;

}catch(e){

console.log(e);

}

}

html += `</div>`;

content.innerHTML =
html;

}

function openContent(url){

location.href =
url;

}

async function removeItem(id){

const user =
auth.currentUser;

await db.collection("users")
.doc(user.uid)
.collection("myList")
.doc(id)
.delete();

loadMyList(user.uid);

}

</script>

</body>
</html>
