<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LzPlay Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<div class="bg"></div>

<!-- FORMULARIO DE LOGIN -->
<div class="card" id="loginCard">
  <div class="logo">Lz<span>Play</span></div>
  <p class="subtitle">Accede a tu cuenta</p>
  <div class="tabs">
    <button class="tab active" id="loginTab">Iniciar sesión</button>
    <button class="tab" id="registerTab">Registrarse</button>
  </div>
  <div class="input-group">
    <input type="email" id="email" class="input" placeholder="Correo electrónico">
  </div>
  <div class="input-group">
    <input type="password" id="password" class="input" placeholder="Contraseña">
  </div>
  <button class="btn btn-primary" id="mainBtn">Iniciar sesión</button>
  <div class="or">o continuar con</div>
  <button class="btn google-btn" id="googleBtn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    Continuar con Google
  </button>
  <div class="link" id="forgotPassword">¿Olvidaste tu contraseña?</div>
  <div class="loading" id="loading">Procesando...</div>
</div>

<!-- PANTALLA DE BIENVENIDA -->
<div id="welcomeScreen">
  <div class="welcome-avatar">
    <img id="welcomeAvatar" src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg" alt="Avatar">
  </div>
  <div class="welcome-name" id="welcomeName">¡Hola!</div>
  <div class="welcome-subtitle">Bienvenido de nuevo a LzPlay</div>
  
  <div class="welcome-buttons">
    <button class="btn btn-primary" onclick="goToHome()">Ir al inicio</button>
    <button class="btn btn-secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
</script>
</body>
</html>
