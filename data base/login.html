<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LzPlay Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#000;
color:#fff;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
overflow:hidden;
}

.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.9)),
url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974&auto=format&fit=crop');
background-size:cover;
background-position:center;
z-index:-1;
filter:blur(5px);
transform:scale(1.1);
}

.card{
width:100%;
max-width:420px;
background:rgba(20,20,20,.95);
border:1px solid rgba(255,255,255,.08);
backdrop-filter:blur(20px);
border-radius:30px;
padding:35px;
box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
font-size:38px;
font-weight:700;
text-align:center;
margin-bottom:8px;
}

.logo span{
color:#fff;
}

.subtitle{
text-align:center;
color:#999;
font-size:14px;
margin-bottom:35px;
}

.tabs{
display:flex;
background:#111;
border-radius:14px;
padding:4px;
margin-bottom:25px;
}

.tab{
flex:1;
border:none;
background:none;
color:#999;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:600;
transition:.3s;
}

.tab.active{
background:#fff;
color:#000;
}

.input-group{
margin-bottom:16px;
}

.input{
width:100%;
height:55px;
border:none;
outline:none;
border-radius:14px;
background:#151515;
padding:0 18px;
color:#fff;
font-size:15px;
border:1px solid #222;
transition:.3s;
}

.input:focus{
border-color:#555;
}

.btn{
width:100%;
height:56px;
border:none;
border-radius:16px;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:.3s;
}

.btn-primary{
background:#fff;
color:#000;
margin-top:10px;
}

.btn-primary:hover{
transform:translateY(-2px);
}

.google-btn{
background:#111;
color:#fff;
display:flex;
align-items:center;
justify-content:center;
gap:12px;
margin-top:15px;
border:1px solid #222;
}

.google-btn img{
width:20px;
}

.or{
text-align:center;
margin:18px 0;
font-size:13px;
color:#777;
}

.link{
text-align:center;
margin-top:18px;
font-size:14px;
color:#999;
cursor:pointer;
}

.link:hover{
color:#fff;
}

.loading{
display:none;
margin-top:20px;
text-align:center;
font-size:14px;
color:#aaa;
}

@media(max-width:480px){
.card{
padding:28px 22px;
border-radius:24px;
}
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">

<div class="logo">Lz<span>Play</span></div>
<p class="subtitle">Accede a tu cuenta</p>

<div class="tabs">
<button class="tab active" id="loginTab">
Iniciar sesión
</button>

<button class="tab" id="registerTab">
Registrarse
</button>
</div>

<div class="input-group">
<input type="email"
id="email"
class="input"
placeholder="Correo electrónico">
</div>

<div class="input-group">
<input type="password"
id="password"
class="input"
placeholder="Contraseña">
</div>

<button class="btn btn-primary"
id="mainBtn">
Iniciar sesión
</button>

<div class="or">
o continuar con
</div>

<button class="btn google-btn"
id="googleBtn">
<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
Continuar con Google
</button>

<div class="link"
id="forgotPassword">
¿Olvidaste tu contraseña?
</div>

<div class="loading"
id="loading">
Procesando...
</div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

const firebaseConfig = {
apiKey: "AIzaSyDb1vEGCkNpcarttuwLLvuB40g8reRFTGM",
authDomain: "applelz-b5883.firebaseapp.com",
projectId: "applelz-b5883",
storageBucket: "applelz-b5883.firebasestorage.app",
messagingSenderId: "489468218632",
appId: "1:489468218632:web:598a550f7ebe7c6de7b0bd",
measurementId: "G-J085DHR8M3"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const REDIRECT_URL =
"https://lzplayhd.online/apple/data%20base/";

let isLogin = true;

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const mainBtn =
document.getElementById("mainBtn");

const loginTab =
document.getElementById("loginTab");

const registerTab =
document.getElementById("registerTab");

const loading =
document.getElementById("loading");

loginTab.onclick = () => {
isLogin = true;

loginTab.classList.add("active");
registerTab.classList.remove("active");

mainBtn.innerText =
"Iniciar sesión";
};

registerTab.onclick = () => {
isLogin = false;

registerTab.classList.add("active");
loginTab.classList.remove("active");

mainBtn.innerText =
"Crear cuenta";
};

function showLoading(show=true){
loading.style.display =
show ? "block" : "none";
}

mainBtn.onclick = async () => {

const emailValue =
email.value.trim();

const passwordValue =
password.value.trim();

if(!emailValue || !passwordValue){
alert("Completa todos los campos");
return;
}

try{

showLoading();

if(isLogin){

await auth.signInWithEmailAndPassword(
emailValue,
passwordValue
);

}else{

const userCredential =
await auth.createUserWithEmailAndPassword(
emailValue,
passwordValue
);

const user =
userCredential.user;

await db.collection("users")
.doc(user.uid)
.set({
uid:user.uid,
email:user.email,
createdAt:
firebase.firestore.FieldValue.serverTimestamp(),
settings:{
theme:"dark",
language:"es"
},
myList:[]
},{merge:true});

}

window.location.href =
REDIRECT_URL;

}catch(error){

alert(error.message);

}finally{
showLoading(false);
}

};

document.getElementById("googleBtn")
.onclick = async () => {

try{

showLoading();

const provider =
new firebase.auth.GoogleAuthProvider();

const result =
await auth.signInWithPopup(provider);

const user =
result.user;

await db.collection("users")
.doc(user.uid)
.set({
uid:user.uid,
name:user.displayName || "",
email:user.email || "",
photo:user.photoURL || "",
lastLogin:
firebase.firestore.FieldValue.serverTimestamp()
},{merge:true});

window.location.href =
REDIRECT_URL;

}catch(error){
alert(error.message);
}finally{
showLoading(false);
}

};

document.getElementById("forgotPassword")
.onclick = async () => {

const emailValue =
email.value.trim();

if(!emailValue){
alert("Ingresa tu correo");
return;
}

try{

await auth.sendPasswordResetEmail(
emailValue
);

alert(
"Correo enviado para restablecer contraseña"
);

}catch(error){
alert(error.message);
}

};

auth.onAuthStateChanged((user)=>{

if(user){
window.location.href =
REDIRECT_URL;
}

});

</script>

</body>
</html>
