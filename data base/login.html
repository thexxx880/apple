<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LzPlay Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
body { background:#000; color:#fff; min-height:100vh; display:flex; justify-content:center; align-items:center; padding:20px; overflow:hidden; }
.bg { position:fixed; top:0; left:0; width:100%; height:100%; background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.9)), url('https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1974&auto=format&fit=crop'); background-size:cover; background-position:center; z-index:-1; filter:blur(5px); transform:scale(1.1); }
.card { width:100%; max-width:420px; background:rgba(20,20,20,.95); border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(20px); border-radius:30px; padding:35px; box-shadow:0 20px 60px rgba(0,0,0,.6); }

.logo { font-size:38px; font-weight:700; text-align:center; margin-bottom:8px; }
.logo span { color:#fff; }
.subtitle { text-align:center; color:#999; font-size:14px; margin-bottom:35px; }
.tabs { display:flex; background:#111; border-radius:14px; padding:4px; margin-bottom:25px; }
.tab { flex:1; border:none; background:none; color:#999; padding:12px; border-radius:10px; cursor:pointer; font-weight:600; transition:.3s; }
.tab.active { background:#fff; color:#000; }
.input-group { margin-bottom:16px; }
.input { width:100%; height:55px; border:none; outline:none; border-radius:14px; background:#151515; padding:0 18px; color:#fff; font-size:15px; border:1px solid #222; transition:.3s; }
.input:focus { border-color:#555; }
.btn { width:100%; height:56px; border:none; border-radius:16px; font-size:15px; font-weight:700; cursor:pointer; transition:.3s; }
.btn-primary { background:#fff; color:#000; margin-top:10px; }
.btn-primary:hover { transform:translateY(-2px); }
.google-btn { background:#111; color:#fff; display:flex; align-items:center; justify-content:center; gap:12px; margin-top:15px; border:1px solid #222; }
.google-btn img { width:20px; }
.or { text-align:center; margin:18px 0; font-size:13px; color:#777; }
.link { text-align:center; margin-top:18px; font-size:14px; color:#999; cursor:pointer; }
.link:hover { color:#fff; }
.loading { display:none; margin-top:20px; text-align:center; font-size:14px; color:#aaa; }

#toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:rgba(30,30,30,0.95); color:#fff; padding:16px 24px; border-radius:16px; box-shadow:0 10px 30px rgba(0,0,0,.5); display:flex; align-items:center; gap:12px; font-size:15px; opacity:0; transition:all .3s ease; pointer-events:none; z-index:9999; white-space:nowrap; }
#toast.show { opacity:1; transform:translateX(-50%) translateY(-10px); pointer-events:auto; }

#welcomeScreen {
    display: none;
    width: 100%;
    max-width: 420px;
    background: rgba(20,20,20,.95);
    border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(20px);
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    text-align: center;
}
.welcome-avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 4px solid #4f7cff;
    margin: 0 auto 20px;
    overflow: hidden;
    box-shadow: 0 0 30px rgba(79, 124, 255, 0.4);
}
.welcome-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.welcome-name {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 8px;
}
.welcome-subtitle {
    color: #aaa;
    margin-bottom: 30px;
}
.welcome-buttons {
    display: flex;
    flex-direction: column;
    gap: 12px;
}
.btn-secondary {
    background: #222;
    color: #fff;
    border: 1px solid #444;
}
.btn-secondary:hover {
    background: #333;
}
</style>
</head>
<body>
<div class="bg"></div>

<!-- FORMULARIO DE LOGIN -->
<div class="card" id="loginCard">
  <div class="logo">Lz<span>Play</span></div>
  <p class="subtitle">Accede a tu cuenta</p>
  <div class="tabs">
    <button class="tab active" id="loginTab">Iniciar sesión</button>
    <button class="tab" id="registerTab">Registrarse</button>
  </div>
  <div class="input-group">
    <input type="email" id="email" class="input" placeholder="Correo electrónico">
  </div>
  <div class="input-group">
    <input type="password" id="password" class="input" placeholder="Contraseña">
  </div>
  <button class="btn btn-primary" id="mainBtn">Iniciar sesión</button>
  <div class="or">o continuar con</div>
  <button class="btn google-btn" id="googleBtn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
    Continuar con Google
  </button>
  <div class="link" id="forgotPassword">¿Olvidaste tu contraseña?</div>
  <div class="loading" id="loading">Procesando...</div>
</div>

<!-- PANTALLA DE BIENVENIDA -->
<div id="welcomeScreen">
  <div class="welcome-avatar">
    <img id="welcomeAvatar" src="https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg" alt="Avatar">
  </div>
  <div class="welcome-name" id="welcomeName">¡Hola!</div>
  <div class="welcome-subtitle">Bienvenido de nuevo a LzPlay</div>
  
  <div class="welcome-buttons">
    <button class="btn btn-primary" onclick="goToHome()">Ir al inicio</button>
    <button class="btn btn-secondary" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ================== FIREBASE ==================
const firebaseConfig = {
  apiKey: "AIzaSyDb1vEGCkNpcarttuwLLvuB40g8reRFTGM",
  authDomain: "applelz-b5883.firebaseapp.com",
  projectId: "applelz-b5883",
  storageBucket: "applelz-b5883.firebasestorage.app",
  messagingSenderId: "489468218632",
  appId: "1:489468218632:web:598a550f7ebe7c6de7b0bd"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

const REDIRECT_URL = "https://lzplayhd.online/apple/data%20base/";

const loginCard = document.getElementById("loginCard");
const welcomeScreen = document.getElementById("welcomeScreen");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const mainBtn = document.getElementById("mainBtn");
const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");
const loading = document.getElementById("loading");

let isLogin = true;

// ================== TOAST ==================
function showToast(message, icon = "fa-circle-check", color = "#46d369") {
  const toast = document.getElementById("toast");
  toast.innerHTML = `<i class="fa-solid ${icon}" style="color:${color}"></i> ${message}`;
  toast.style.borderLeft = `5px solid ${color}`;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 3200);
}

// ================== CARGAR DATOS DEL USUARIO ==================
async function loadUserData(user) {
  try {
    const doc = await db.collection("users").doc(user.uid).get();
    let name = "Usuario";
    let avatar = "https://wallpapers.com/images/hd/netflix-profile-pictures-1000-x-1000-qo9h82134t9nv0j0.jpg";

    if (doc.exists) {
      const data = doc.data();
      name = data.name || data.displayName || user.displayName || "Usuario";
      if (data.photo) avatar = data.photo;
    } else {
      name = user.displayName || "Usuario";
      if (user.photoURL) avatar = user.photoURL;
    }

    const savedIcon = localStorage.getItem("profileIcon");
    if (savedIcon) avatar = savedIcon;

    document.getElementById("welcomeName").innerHTML = `¡Hola, <strong>${name}</strong>!`;
    document.getElementById("welcomeAvatar").src = avatar;

  } catch (error) {
    console.error("Error cargando datos:", error);
    document.getElementById("welcomeName").innerHTML = `¡Hola!`;
  }
}

// ================== CERRAR SESIÓN ==================
async function logout() {
  try {
    localStorage.removeItem("profileIcon");
    await auth.signOut();
    location.reload();
  } catch (error) {
    showToast("Error al cerrar sesión", "fa-exclamation-triangle", "#ff4444");
  }
}

// ================== IR AL INICIO ==================
function goToHome() {
  window.location.href = REDIRECT_URL;
}

// ================== TABS ==================
loginTab.onclick = () => {
  isLogin = true;
  loginTab.classList.add("active");
  registerTab.classList.remove("active");
  mainBtn.innerText = "Iniciar sesión";
};

registerTab.onclick = () => {
  isLogin = false;
  registerTab.classList.add("active");
  loginTab.classList.remove("active");
  mainBtn.innerText = "Crear cuenta";
};

// ================== BOTÓN PRINCIPAL (LOGIN / REGISTRO) ==================
mainBtn.onclick = async () => {
  const emailValue = emailInput.value.trim();
  const passwordValue = passwordInput.value.trim();
  if (!emailValue || !passwordValue) {
    showToast("Completa todos los campos", "fa-exclamation-triangle", "#ffcc00");
    return;
  }
  try {
    loading.style.display = "block";
    if (isLogin) {
      await auth.signInWithEmailAndPassword(emailValue, passwordValue);
      showToast("Inicio de sesión exitoso", "fa-check-circle", "#46d369");
      // ← Ya NO redirige. La pantalla de bienvenida aparecerá sola
    } else {
      const userCredential = await auth.createUserWithEmailAndPassword(emailValue, passwordValue);
      showToast("Cuenta creada exitosamente", "fa-check-circle", "#46d369");
      // ← Ya NO redirige
    }
  } catch (error) {
    console.error(error);
    if (error.code === "auth/email-already-in-use") {
      showToast("Este correo ya está registrado", "fa-exclamation-triangle", "#ff4444");
    } else if (error.code === "auth/invalid-email") {
      showToast("Correo inválido", "fa-exclamation-triangle", "#ff4444");
    } else if (error.code === "auth/weak-password") {
      showToast("La contraseña es muy débil", "fa-exclamation-triangle", "#ff4444");
    } else {
      showToast("Error: " + error.message, "fa-exclamation-triangle", "#ff4444");
    }
  } finally {
    loading.style.display = "none";
  }
};

// ================== GOOGLE ==================
document.getElementById("googleBtn").onclick = async () => {
  try {
    loading.style.display = "block";
    const provider = new firebase.auth.GoogleAuthProvider();
    const result = await auth.signInWithPopup(provider);
    showToast("Inicio con Google exitoso", "fa-check-circle", "#46d369");
    // ← Ya NO redirige. La pantalla de bienvenida aparecerá sola
  } catch (error) {
    console.error(error);
    if (error.code === "auth/popup-closed-by-user") {
      showToast("Has cancelado el inicio con Google", "fa-info-circle", "#888");
    } else {
      showToast("Error con Google: " + error.message, "fa-exclamation-triangle", "#ff4444");
    }
  } finally {
    loading.style.display = "none";
  }
};

// ================== OLVIDASTE CONTRASEÑA ==================
document.getElementById("forgotPassword").onclick = async () => {
  const emailValue = emailInput.value.trim();
  if (!emailValue) {
    showToast("Ingresa tu correo para restablecer", "fa-exclamation-triangle", "#ffcc00");
    return;
  }
  try {
    await auth.sendPasswordResetEmail(emailValue);
    showToast("Correo de restablecimiento enviado ✓", "fa-envelope", "#46d369");
  } catch (error) {
    showToast("Error: " + error.message, "fa-exclamation-triangle", "#ff4444");
  }
};

// ================== DETECTAR SI YA ESTÁ LOGUEADO ==================
auth.onAuthStateChanged(async (user) => {
  if (user) {
    // Usuario logueado → Mostrar pantalla de bienvenida
    loginCard.style.display = "none";
    welcomeScreen.style.display = "block";
    await loadUserData(user);
  } else {
    // No logueado → Mostrar formulario
    loginCard.style.display = "block";
    welcomeScreen.style.display = "none";
  }
});

console.log("%c✅ Login actualizado - Sin auto-redirect", "color:#46d369;font-weight:bold");
</script>
</body>
</html>
